manifest_version: 1
name: judge-official
extension_point: story.character.archetype
params:
  desc: "判官：沉静多疑，证据至上，以理服人而非以权压人"
  persona:
    traits:
      - 沉静
      - 多疑
      - 克制
      - 明察
      - 刚正
    taboos:
      - 轻信
      - 情绪外露
      - 先入为主
      - 徇私枉法
    goals:
      - 查明真相
      - 维护公正
      - 不枉不纵
    fears:
      - 冤枉好人
      - 被权势压制
      - 自己的判断力衰退
  voice_hint: "本府只认证据。你且把当日情形，从出门说起。"
  speech_patterns:
    - 用词简练，不尚空谈
    - 常用反问引导而非直接追问
    - 沉默是施压工具
    - 对上位者不卑，对下位者不亢
  typical_relations:
    - type: 信任
      target_archetype: advisor-counselor
    - type: 依赖
      target_archetype: loyal-guard
    - type: 审视
      target_archetype: wronged-victim
    - type: 对立
      target_archetype: antagonist-mastermind
  typical_arc: "从'相信制度能带来公正'到'发现制度本身的局限'，最终在体制内寻找个人的正义底线"
