manifest_version: 1
name: fair-play-knox
extension_point: story.world.rule
params:
  title: "诺克斯十诫"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "Knox 侦探小说十诫（1928）：黄金时代公平推理规则，确保读者享有与侦探平等的推理权"
  # P21：规则均为 kind: narrative——创作约束无法落入 Z3 5 事实词汇表，
  # 进 LLM prompt（hard_requirements）不进 validator（原 expr 全部拒载失效）
  rules:
    - id: knox_1
      kind: narrative
      desc: "凶手必须是故事早期出现过的角色，且读者未被允许进入其内心"
    - id: knox_2
      kind: narrative
      desc: "排除一切超自然或灵异手段作为破案关键"
    - id: knox_3
      kind: narrative
      desc: "至多一处密室或暗道"
    - id: knox_4
      kind: narrative
      desc: "不得使用未被发现的毒药或需要长篇科学解释的装置"
    - id: knox_6
      kind: narrative
      desc: "侦探不得靠偶然事故或无根据的直觉破案"
    - id: knox_7
      kind: narrative
      desc: "侦探本人不得是罪犯"
    - id: knox_8
      kind: narrative
      desc: "侦探发现的线索必须立即呈现给读者"
    - id: knox_10
      kind: narrative
      desc: "双胞胎/替身不得出现，除非已事先铺垫"
  source: hermes
  source_notes: "Ronald Knox 'Decalogue' (1928), Detection Club. 第5条因时代偏见已弃用。"
