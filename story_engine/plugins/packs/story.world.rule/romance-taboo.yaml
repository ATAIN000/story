manifest_version: 1
name: romance-taboo
extension_point: story.world.rule
params:
  title: "言情禁忌"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "言情类型禁忌：维护情感真实性和角色自主性的底线规则"
  # P21：规则均为 kind: narrative——创作约束无法落入 Z3 5 事实词汇表，
  # 进 LLM prompt（hard_requirements）不进 validator（原 expr 全部拒载失效）
  rules:
    - id: romance_no_character_assassination
      kind: narrative
      desc: "禁止为推动剧情而让角色突然降智——误会必须基于合理的信息障碍，而非角色突然变蠢"
    - id: romance_no_unearned_reunion
      kind: narrative
      desc: "和解必须有前因——不能突然「想通了」就和好，必须有外部事件或内心转变的具体过程"
    - id: romance_consent_boundary
      kind: narrative
      desc: "亲密场景必须体现双方意愿——禁止将强迫行为浪漫化"
    - id: romance_no_love_triangle_stall
      kind: narrative
      desc: "三角恋不能无限拖延——必须在合理章节数内给出明确倾向，不能反复横跳超过3次"
    - id: romance_emotional_continuity
      kind: narrative
      desc: "角色情感状态必须有连续性——不能上一章还在痛哭，下一章毫无过渡地笑闹"
  source: hermes
  source_notes: "言情写作公平性原则 + 角色一致性基本要求"
