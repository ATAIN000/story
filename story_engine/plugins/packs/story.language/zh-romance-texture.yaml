manifest_version: 1
name: zh-romance-texture
extension_point: story.language
params:
  title: "言情婉约质感"  # P9.1 中文显示名（id 仍为功能键，不变）
  language: zh
  resources:
    四字格:
      - 怦然心动
      - 欲言又止
      - 若即若离
      - 情不自禁
      - 心如刀割
      - 默默无语
      - 百转千回
      - 一往情深
      - 柔肠寸断
      - 含情脉脉
      - 欲擒故纵
      - 魂牵梦萦
      - 刻骨铭心
      - 恍若隔世
      - 泪眼朦胧
    感官描写词:
      触觉:
        - 指尖微凉
        - 掌心滚烫
        - 呼吸拂过耳际
        - 衣袖擦过手背
        - 背脊贴上冰冷的墙壁
      视觉:
        - 睫毛轻颤
        - 眼眶泛红
        - 嘴唇微启
        - 目光躲闪
        - 影子交叠在一起
      听觉:
        - 心跳声清晰可闻
        - 呼吸变得急促
        - 寂静中只有钟摆的声响
        - 脚步声渐远
        - 一声极轻的叹息
    情感隐喻:
      - "心像是被一只无形的手攥紧了"
      - "所有的防线在那一瞬间碎成了齑粉"
      - "胸腔里有什么东西正在融化"
      - "理智和心跳在进行一场早已注定的战争"
      - "她感觉自己像是一片在风中打转的落叶"
    氛围词:
      - 暖光斜照
      - 暮色四合
      - 细雨如织
      - 月色如水
      - 花香若有若无
      - 窗帘被风掀起一角
    对话节奏模板:
      - "「……」{角色}顿了顿，声音低了下去。"
      - "{角色}没有说话，只是垂下了眼。"
      - "沉默横亘在两人之间，像一道看不见的墙。"
      - "「你……」话到嘴边，又被咽了回去。"
      - "他张了张嘴，最终只是摇了摇头。"
  texture_hints:
    idiom_density: 0.3
    honorific_register: 0.2
    sentence_length: short_mixed
    register: 现代抒情
