# 语言资源包：公案文白质感（zh）（P7.7 intake 合并版：hermes 与 manual 样例词条并集去重，
# texture_hints 取更完整的 hermes 版；对仗模板为 manual 样例独有类目，保留）
manifest_version: 1
name: zh-gongan-texture
extension_point: story.language
params:
  title: "公案文白质感"  # P9.1 中文显示名（id 仍为功能键，不变）
  language: zh
  resources:
    四字格:
      # hermes 15 条
      - 步履沉稳
      - 神色不动
      - 洞若观火
      - 明察秋毫
      - 威仪凛然
      - 不怒自威
      - 胸有成竹
      - 按部就班
      - 抽丝剥茧
      - 顺藤摸瓜
      - 铁证如山
      - 滴水不漏
      - 义正辞严
      - 掷地有声
      - 厉声喝问
      # manual 样例独有 10 条（明察秋毫/洞若观火已并上去重）
      - 铁面无私
      - 蛛丝马迹
      - 水落石出
      - 不动声色
      - 沉吟半晌
      - 字斟句酌
      - 执法如山
      - 心细如发
      - 临危不乱
      - 大义凛然
    文言虚词:
      # 并集 19 条：hermes 14 + manual 独有 遂/方/且/之/耳
      - 既
      - 亦
      - 乃
      - 者
      - 也
      - 矣
      - 乎
      - 哉
      - 焉
      - 尔
      - 盖
      - 夫
      - 惟
      - 苟
      - 遂
      - 方
      - 且
      - 之
      - 耳
    敬语体系:
      上位: [大人, 明公, 府尊, 老大人, 阁下, 恩相, 老爷]
      下位: [草民, 小人, 罪民, 在下, 晚生, 民妇, 卑职]
      平级: [先生, 兄台, 阁下, 足下, 同僚, 仁兄]
    公堂用语:
      - "升堂"
      - "退堂"
      - "惊堂木"
      - "大刑伺候"
      - "从实招来"
      - "画押"
      - "人证物证"
      - "铁案如山"
      - "沉冤得雪"
      - "疑犯"
    动作描写模板:
      - "{角色}微微眯眼，指节在案上轻叩三下。"
      - "{角色}拂袖而起，袍角带起一阵风。"
      - "{角色}缓缓将茶盏搁下，杯底与桌面相触，发出极轻的一声脆响。"
      - "惊堂木落下，堂下跪着的人齐齐一颤。"
    氛围渲染词:
      - 堂烛摇曳
      - 更鼓声远
      - 月冷如霜
      - 鸦雀无声
      - 暗流涌动
    对仗模板:
      - "堂前明镜高悬, 阶下人心自照"
      - "法度不阿权贵, 公理自在人心"
      - "灯下一卷宗, 堂前两造词"
  texture_hints:
    idiom_density: 0.5
    honorific_register: 0.6
    sentence_length: medium
    register: 文白相间
  source: hermes+manual
