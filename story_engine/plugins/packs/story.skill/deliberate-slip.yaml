# 技能包：露怯笔法（嫌疑人说漏嘴的三种写法）
manifest_version: 1
name: deliberate-slip
extension_point: story.skill
params:
  desc: "露怯笔法：嫌疑人说出本不该知道的信息"
  trigger: "嫌疑人应答/辩解/自白场景"
  prompt_template: |
    露怯三法，任选其一，一处即止：
    ①主动撇清：无人提及的事，他先急着否认（堂上没人提刘伯，他先说「与刘伯素无往来」）。
    ②过度流利：对不该熟的细节倒背如流（不问自答案发当夜的更次与风向）。
    ③细节过准：描述出只有当事者才知道的物件特征（说出赃物内侧的刻字位置）。
    关键：露怯处不点破，叙述者装作无事发生，把发现留给读者。
  postprocess: ""
  examples:
    good: "「小人与那王府管家素无往来。」张三叩首。堂上至此，并没有人提过刘伯。"
    bad: "张三神色慌张，说话结结巴巴，一看就有问题。"
  source: manual
