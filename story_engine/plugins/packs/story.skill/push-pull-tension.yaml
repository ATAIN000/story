manifest_version: 1
name: push-pull-tension
extension_point: story.skill
params:
  title: "推拉张力"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "情感推拉：亲近与疏离的交替节奏，在距离感中制造情感张力"
  trigger: "言情/暧昧/暗恋章节，需要制造暧昧张力"
  prompt_template: |
    情感推拉四拍节奏：
    第一拍——靠近（Push toward）：一方主动拉近距离。一个不设防的瞬间、一次意外的身体接触、一句脱口的真心话。
    第二拍——退缩（Pull back）：另一方因恐惧/骄傲/身份而后撤。用冷淡或转移话题来保护自己。
    第三拍——追逐（Pursue）：退缩激发了追逐欲。靠近方更加主动，但方式从直白转为试探（「你刚才……是不是……」）。
    第四拍——打破（Break）：某个意外打破推拉平衡——一场病、一次危险、一个第三人介入——让防御暂时瓦解。

    操作纪律：
    1. 推拉节奏不能机械交替（靠近→退缩→靠近→退缩），每次循环的距离应缩短
    2. 退缩的理由必须可信（不是欲擒故纵的套路，而是真实的心理障碍）
    3. 第四拍的"打破"必须是外部事件，不能是角色突然"想通了"
    4. 推拉的高潮不是接吻/表白，而是双方同时放弃防御的瞬间
  postprocess: ""
  examples:
    good: "他替她挡了一杯酒后若无其事地离开（靠近）→ 她追上去想说谢谢，他已经消失（退缩）→ 第二天她在他的抽屉里发现那张她随手画的速写（追逐的变体）→ 一场暴雨困住了他们（打破）。"
    bad: "「我喜欢你。」「我不喜欢你。」「我真的喜欢你。」「好吧我也喜欢你。」——毫无推拉张力。"
  source: hermes
  source_notes: "言情推拉节奏 + 依恋心理学 avoidant-anxious 动态"
