manifest_version: 1
name: concealed-sacrifice-reveal
extension_point: story.skill
params:
  title: "隐线牺牲"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "隐忍牺牲揭露：角色默默承受的牺牲被对方意外发现，形成情感核弹"
  trigger: "言情/虐心/和解章节，需要制造情感爆点"
  prompt_template: |
    隐忍牺牲揭露三段式：
    铺垫（前5-10章）：角色默默做了某件事——放弃机会、承受误解、隐藏伤痛——但被伪装成"不在意"或"有别的理由"。
    揭露（突然）：另一方通过一个意外渠道发现真相——一封信、一个第三人无意间说出的话、一件遗留物。
    冲击（余波）：发现者的情绪不是感动，而是混合了愧疚、心疼和愤怒——「你为什么不告诉我！」

    操作纪律：
    1. 牺牲者不能"演"——铺垫时他的行为必须看起来真的"不在意"或"有别的理由"
    2. 揭露不能由牺牲者自己说出——必须是被动揭露，才形成冲击
    3. 揭露后的情感不能立即和解——必须有消化期，发现者需要时间处理愧疚
    4. 最强的版本：牺牲者不知道自己被发现了，发现者默默改变了对他的态度
  postprocess: ""
  examples:
    good: "他一直说「不疼」——她在他换药时才发现，他后背的伤已经反复感染了三个月，每次都自己偷偷清理。"
    bad: "他深情地说「为了你，我什么都愿意承受」——牺牲者自己表白，削弱了冲击力。"
  source: hermes
  source_notes: "言情虐心经典结构「默默付出被意外发现」"
