# 技能包：伏笔回响（回收时的前呼后应）
manifest_version: 1
name: foreshadow-echo
extension_point: story.skill
params:
  desc: "伏笔回收写法：让读者自己想起来，而不是被告知"
  trigger: "伏笔到期/真相揭晓/证据闭合场景"
  prompt_template: |
    回收三戒：
    ①不复述——不用大段闪回重复伏笔原文，给一个相似意象或相同句式即可（「半角当票」再现，只露半角）。
    ②不点破——叙述者不说「原来如此」，让角色用行动反应（包拯把拓片推过去，不再多说一字）。
    ③不孤立——回收必带新信息：旧伏笔落地的同时，让它牵出一个新问题。
  postprocess: ""
  examples:
    good: "刘伯袖口的半角当票，此刻正压在账房的算盘底下。包拯看了一眼，没有说话。"
    bad: "原来当初那个当票就是伏笔！读者们还记得吗，第二章就写过了。"
  source: manual
