manifest_version: 1
name: courtroom-interrogation
extension_point: story.skill
params:
  desc: "公堂问审：先问行踪、后亮物证的逼问节奏，层层收紧让嫌疑人自相矛盾"
  trigger: "公堂/审问/提审/对质场景，或需要施压揭穿谎言的对话"
  prompt_template: |
    问审三段式节奏：
    第一阶段——行踪确认：从嫌疑人无法否认的客观事实切入（时间、地点、在场人），逐条确认，建立"如实回答"的基调。
    第二阶段——细节追问：在行踪基础上追问看似无关的细节（衣着、天气、他人动线），制造安全感的假象，实则埋设矛盾点。
    第三阶段——物证突袭：在嫌疑人已固定供词后，突然亮出与之矛盾的物证。不解释物证含义，让沉默施压。
    禁止直接抛出结论指控（"就是你干的"），必须让嫌疑人在已固定的供词与物证之间自己崩塌。
  postprocess: "检查是否有至少两处供词前后矛盾被物证坐实"
  examples:
    good: "「初七戌时，你在何处？」「……在房中读书。」「可有人证实？」「……不曾有。」「（沉默片刻，将当铺拓片一掷而下）此物何来？」"
    bad: "包拯喝道：「就是你偷的！从实招来！」——缺少行踪铺垫和物证突袭，直接跳到结论。"
  source: hermes
  source_notes: "化用清代侠义公案小说审案结构 + 现代刑侦审讯技巧"
