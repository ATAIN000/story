manifest_version: 1
name: jianghu-debt-escalation
extension_point: story.skill
params:
  title: "江湖恩怨"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "江湖恩怨递进：私人恩怨层层升级为门派之争、正邪之战，每层都有新势力卷入"
  trigger: "武侠/江湖冲突章节，需要升级矛盾规模"
  prompt_template: |
    江湖恩怨升级四级：
    第一级·私人恩怨：两人之间的冲突（夺宝、情仇、口角）。规模最小，但动机最直接。
    第二级·门派介入：恩怨波及双方所属门派。师父/掌门的态度成为变量——可能压制也可能扩大。
    第三级·江湖站队：更多门派和势力被卷入（同盟关系、宿敌借机发难、中立者被迫表态）。
    第四级·正邪定性：冲突被赋予了正邪/大义的标签——不再是私人恩怨，而是「正道vs魔教」的定性之战。

    纪律：
    1. 每级升级必须有具体的触发事件（不能凭空升级）
    2. 每级升级后，可调用的资源增加，但约束也增加（门派规矩、江湖道义）
    3. 升级过程中，主角的"私人恩怨"会被各方势力利用和重新解读
    4. 最强的恩怨升级：主角发现自己站在了"错误"的一边——私人正义与江湖大义冲突
  postprocess: ""
  examples:
    good: "徒弟与对方弟子的口角 → 对方掌门亲自上门讨说法 → 六大门派借此围攻魔教余孽 → 主角发现自己师父才是当年灭门惨案的真凶。"
    bad: "「于是整个江湖都卷入了这场大战」——缺少逐级升级的具体过程。"
  source: hermes
  source_notes: "金庸式恩怨递进结构（私怨→门派→正邪→真相）"
