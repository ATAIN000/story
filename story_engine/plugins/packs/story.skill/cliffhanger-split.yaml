manifest_version: 1
name: cliffhanger-split
extension_point: story.skill
params:
  title: "章末扣子"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "评书扣子（悬念截断）：在关键转折处骤然截断，制造强烈的「欲知后事」冲动"
  trigger: "章末/集末，或需要在情节高潮处制造断点"
  prompt_template: |
    评书扣子三型：
    断案型——真相即将揭晓时截断：「包拯一拍惊堂木，喝道：『凶手便是——』要知后事如何，且听下回分解。」
    危机型——主角陷入生死关头时截断：「刀光闪过，他只来得及看见来人腰间的玉佩——」
    抉择型——面临重大选择时截断：「两条路摆在面前：一条通向真相但代价惨重，另一条保全所有人但真相永埋——」

    操作纪律：
    1. 扣子必须卡在"信息即将释放但尚未释放"的精确瞬间
    2. 截断前最后一个细节必须是可以被后续回收的钩子（一个画面、一句话、一个物件）
    3. 禁止在平淡处截断——扣子的前一句必须已经建立了足够的情感张力
  postprocess: ""
  examples:
    good: "「……她终于看清了那人面具下的脸，瞳孔猛缩——」（章末截断，下一章开头回收）"
    bad: "「于是他们继续赶路，明天可能会遇到一些事情。」（章末平淡截断，无张力）"
  source: hermes
  source_notes: "源自评书/章回体小说「且听下回分解」传统结构"
