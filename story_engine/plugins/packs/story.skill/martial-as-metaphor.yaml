manifest_version: 1
name: martial-as-metaphor
extension_point: story.skill
params:
  desc: "以武喻理：武打场面承载人物性格冲突和价值观对撞，不是单纯的打斗"
  trigger: "武侠/对决/论道场景，需要武打承载主题"
  prompt_template: |
    以武喻理操作法：
    理念先行：确定这场武打要承载什么价值观冲突（如：规则vs自由、隐忍vs爆发、传承vs革新）。
    武学映射：让双方武功风格映射各自理念——刚猛者代表霸道，柔韧者代表包容，诡异者代表阴暗。
    招式即态度：不写"他用了一招XX"，而写"他的剑法说了一句话：你不配"。每个回合都是一次价值观交锋。
    胜负即论辩：谁赢了不重要，重要的是赢的方式回应了理念冲突。刚猛者败于柔韧，说明暴力不能解决一切。

    纪律：
    1. 禁止为打而打——如果一场武打不推进人物/主题，就删掉
    2. 武功描写不能脱离性格——同一种剑法，不同性格的人使出来应该不同
    3. 观众视角：读者看的不只是招式，更是两个人用拳头在辩论
    4. 收束意象：武打结束时用一个意象总结价值观冲突（碎裂的玉佩、未落完的棋局）
  postprocess: "检查武打场面是否推进了人物性格或主题，而非仅为动作展示"
  examples:
    good: "他以最笨拙的直拳击碎了对方精妙绝伦的剑花——「你的剑太聪明了，聪明到忘了拳头的本分是往前走。」"
    bad: "两人打了五千字的武打，结束后读者对两人的性格一无所知。"
  source: hermes
  source_notes: "金庸以武写人 + 古龙以武写意传统"
