manifest_version: 1
name: identity-reversal-impact
extension_point: story.skill
params:
  title: "身份反转"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "身份错位反转：核心身份（阶级/血缘/敌我）的突然揭露，颠覆已建立的全部关系"
  trigger: "言情/悬疑/权谋章节，需要重大反转"
  prompt_template: |
    身份反转操作要点：
    前期建构：让角色在"假身份"下建立真实的关系——友情、爱情、信任。这些关系越深，反转冲击越大。
    反转设计：真实身份必须与前文已有的矛盾细节吻合（某些不合理的行为终于有了解释）。
    情感优先：反转后的第一反应不是"你是谁"，而是"那你之前对我说的……都是假的？"——情感崩塌先于认知调整。
    二次选择：身份揭露后，角色面临核心抉择——是忠于身份（血缘/阶级/使命）还是忠于关系？这个选择定义了人物。

    纪律：身份反转不能用"失忆恢复"等廉价手段。真实身份的线索必须散落在前文中。反转后所有已建立的互动都要被重新审视。
  postprocess: "检查反转前是否有≥2处可回溯的身份暗示"
  examples:
    good: "她一直以为他是落魄书生——当她在朝堂上看到他身着蟒袍立于百官之首时，所有他「不合时宜的从容」终于有了解释。"
    bad: "突然告诉他「其实你是皇帝的私生子」——之前毫无铺垫。"
  source: hermes
  source_notes: "身份反转是言情+权谋核心结构变体"
