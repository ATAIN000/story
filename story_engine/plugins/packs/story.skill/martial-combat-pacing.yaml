manifest_version: 1
name: martial-combat-pacing
extension_point: story.skill
params:
  title: "武打节奏"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "武打四拍节奏：架（起势）→动（交锋）→招（特色技）→果（一击定胜负），避免流水账"
  trigger: "武侠/打斗/对决场景"
  prompt_template: |
    武打场面四拍法（化用金庸式武打描写）：
    第一拍·架（起势）：确立双方站位、气势对比、兵器和招式流派。一句话定调（「他的剑，比对方想象的慢了三分」）。
    第二拍·动（交锋）：描写前三个回合的攻防转换。重点是节奏感——短句快打，长句缓冲。不写每一招，只写转折性的攻防。
    第三拍·招（特色技）：一方使出看家本领或杀招。此时放慢镜头，描写招式的物理细节（风向、力度、轨迹）和心理状态（为何此刻亮出底牌）。
    第四拍·果（定局）：一击分出胜负。结果不是"对方倒下了"，而是通过一个意象收束（「刀落地时，他才意识到自己的手已经不在刀柄上了」）。

    纪律：
    1. 禁止流水账式逐招描写（「他出一拳，对方挡住，又出一脚……」）
    2. 武打必须服务于人物——金庸式武打揭示性格，古龙式武打揭示意境
    3. 环境互动：至少利用一个环境元素（墙壁、水流、光影）参与战斗
    4. 胜负要有代价——胜者带伤，败者留悬念
  postprocess: ""
  examples:
    good: "他抽出那柄从不轻示的短刀时，雪正好落完。三步之内，对手的剑还在半途，刀尖已经点在了咽喉——古龙式一笔定胜负。"
    bad: "「两人大战三百回合，你来我往，打了整整一天一夜，最终他险胜。」——流水账无细节无节奏。"
  source: hermes
  source_notes: "金庸武打「架-动-招-果」四拍结构 + 古龙「一招定胜负」极简美学"
