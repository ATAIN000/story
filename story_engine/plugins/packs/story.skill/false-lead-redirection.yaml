manifest_version: 1
name: false-lead-redirection
extension_point: story.skill
params:
  title: "假线索误导"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "明暗双线误导：铺设表面线索引向错误方向，暗线真相在背后推进"
  trigger: "推理/悬疑/反转章节，需要误导读者预期"
  prompt_template: |
    明暗双线误导操作法：
    明线设计：选择一个"合理但错误"的嫌疑人/方向，给它充分的动机、机会和线索。读者顺着明线推理必须感到"逻辑自洽"。
    暗线设计：真凶/真相的线索必须隐藏在明线线索的"合理副产品"中——某个被读者忽略的细节、某个被解释为其他用途的物件。
    误导公正性：暗线线索必须在反转前已经出现在文本中（不能事后补造）。读者回看时应该能找到至少2处暗线痕迹。
    翻转时机：在读者最确信明线结论时翻转（通常在第3幕开头或高潮前）。
    翻转后果：翻转后必须重新解释明线线索——为什么它们看似指向错误方向但实际合理。
  postprocess: "检查翻转前是否有≥2处暗线痕迹可见，且明线线索翻转后仍可合理解释"
  examples:
    good: "所有证据指向管家（动机：欠债，机会：有钥匙），但真凶是死者之子——管家的欠债恰是因为替少主人掩盖开支，钥匙是少主人复制的。"
    bad: "突然揭示凶手是一个从未出现过的角色，之前毫无线索。"
  source: hermes
  source_notes: "Agatha Christie 式公平误导 + Knox 公平竞赛原则"
