manifest_version: 1
name: escalating-misunderstanding
extension_point: story.skill
params:
  desc: "误会递进：从微小的信息不对称开始，层层加深至致命误解，每层都有合理的信息障碍"
  trigger: "言情/情感冲突章节，需要制造虐心误解"
  prompt_template: |
    误会递进三层结构：
    第一层——善意谎言：一方因保护/体贴隐瞒一件小事。读者知道真相但另一方不知道。
    第二层——信息扭曲：第三方介入（搬弄是非者、意外的目击、断章取义的短信），将善意谎言扭曲成恶意欺骗的假象。
    第三层——致命误解：被误导方在错误认知下做出不可挽回的行动（公开决裂、转身离开、取消婚约）。

    操作纪律：
    1. 每一层误会的信息障碍必须"合理"——不是角色犯蠢，而是信息确实不对称
    2. 读者始终比角色知道更多——这是虐心的来源（「你为什么不解释！」「你没给我机会」）
    3. 解开误会的契机不能是"突然坦白"，必须是一个外部事件逼迫真相浮出水面
    4. 误解越深，解开时的情感释放越强——这是虐文的核心引擎
  postprocess: "检查误会是否有合理的信息障碍支撑，而非角色智商下降"
  examples:
    good: "她隐瞒了病情（善意）→ 他看到她和医生的合影以为是旧情人（扭曲）→ 他在婚礼当天消失（致命误解）→ 病历被意外发现（外部逼出真相）。"
    bad: "两人明明五分钟能说清楚的事，硬是各说半句就走——信息障碍不合理。"
  source: hermes
  source_notes: "言情虐文误会递进结构 + 传播学信息不对称理论"
