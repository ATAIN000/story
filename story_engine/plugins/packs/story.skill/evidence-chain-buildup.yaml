manifest_version: 1
name: evidence-chain-buildup
extension_point: story.skill
params:
  desc: "链式取证：物证逐层递进，每环扣住前环，形成不可辩驳的证据链"
  trigger: "调查/取证/推理章节，需要系统性铺排证据"
  prompt_template: |
    证据链构建四步：
    第一环——动机确立：不需要证明谁有动机，但需要展示"谁可能"有动机。列出2-3个嫌疑人各自的利益关系。
    第二环——机会排查：逐步排除不可能作案的人（不在场证明、身体状况、时间线）。每排除一人都是情节推进。
    第三环——物证聚焦：在剩余嫌疑人中，聚焦关键物证。每个物证必须排除一种可能性、指向一种可能性。
    第四环——闭环确认：最后一块物证必须与前序所有物证形成闭环——它解释了之前所有"不合理"的细节。

    纪律：证据链中允许有1-2个"缺失环节"（未解释的细节），但它们必须在真相揭晓时被统一解释。不能有真正的逻辑漏洞。
  postprocess: ""
  examples:
    good: "鞋印排除穿靴者→时间线排除在外者→凶器上的锈迹指向旧库房→旧库房的借出记录锁定最终嫌疑人。"
    bad: "包拯直接说「本府已查明，就是你」，然后一口气列出所有证据——缺少排除和聚焦过程。"
  source: hermes
  source_notes: "本格推理证据链构建法 + 清代公案的物证铺排"
