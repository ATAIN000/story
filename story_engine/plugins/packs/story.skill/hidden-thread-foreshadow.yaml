manifest_version: 1
name: hidden-thread-foreshadow
extension_point: story.skill
params:
  title: "暗线伏笔"  # P9.1 中文显示名（id 仍为功能键，不变）
  desc: "草蛇灰线：伏笔断续埋设，千里之外收束呼应，前引后应暗示命运走向"
  trigger: "需要铺设长程伏笔的章节，或需要在关键时刻回收前文细节"
  prompt_template: |
    草蛇灰线法操作要点：
    埋设：伏笔必须伪装为"不经意的细节"——一个物件、一句闲话、一个动作习惯。不能让读者意识到这是伏笔。
    断续：同一线索在不同章节以不同面貌出现2-3次（首次提及→中途再现→终章收束），每次间隔至少3章以上。
    收束：回收伏笔时须制造"恍然大悟"感——读者回想起前文细节，发现一切早有暗示。
    检验标准：删除伏笔段落后，收束处仍然逻辑成立但失去了"命运感"。伏笔增加的是宿命厚度，不是逻辑必要性。
  postprocess: "验证每个伏笔至少有埋设点和回收点两处，且间隔≥3章"
  examples:
    good: "第3章写凶手倒茶时惯用左手（看似闲笔），第18章揭示死者伤口在右侧——与左撇子行凶方向吻合。"
    bad: "第3章写「此人惯用左手，将来必有蹊跷」——暴露了伏笔意图，破坏了草蛇灰线的隐蔽性。"
  source: hermes
  source_notes: "源自脂砚斋评《红楼梦》「草蛇灰线，伏脉千里」结构技法"
