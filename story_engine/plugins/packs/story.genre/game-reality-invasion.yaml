manifest_version: 1
name: game-reality-invasion
extension_point: story.genre
activation_events: ["on_genre:game-reality-invasion"]
fusion:
  type: rule_collision
  parent_genres: [litrpg, reality_distortion]
  core_conflict: "游戏规则（可复活有数值任务驱动） vs 现实（死亡不可逆情感真实）——'死亡'的定义被模糊"
  fusion_formula: "游戏化规则 + 现实后果 + 'NPC/玩家'身份错位"
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "游戏启动→规则入侵现实→NPC觉醒/玩家被困→身份真相→终极抉择"
  power_system: "game_reality_blend"          # 游戏机制在现实中生效
  emotion_arcs: [man_in_hole, oedipus]
  conflict_types:
    - {type: cognitive, weight: 0.3}         # 规则破解
    - {type: physical, weight: 0.25}         # 游戏化战斗
    - {type: internal, weight: 0.25}         # 现实vs游戏身份认同
    - {type: relational, weight: 0.2}        # NPC的人性
  information_distribution: rule_discovery
  max_red_herrings: 3
  resolution_pattern: "打破游戏vs现实的边界 + 回答'什么是真实'"
  taboo_list:
    - "游戏规则入侵现实必须有明确机制——不能随意"
    - "NPC必须有'人化'过程——不能纯工具"
    - "现实中的死亡必须有重量——不能像游戏一样轻率"
  evaluation_weights:
    设定一致性: 0.25
    情节连贯: 0.20
    主题深度: 0.20                             # 何为真实/何为人
    角色动机: 0.15
    对话真实度: 0.10
    感官细节: 0.05
    套路检测: 0.05
  active_critics: [setting_consistency, plot_coherence, character_motivation]
  fusion_specific_rules:
    death_permanence: "现实中的死亡不可复活——游戏机制不覆盖死亡"
    npc_awakening: "NPC随剧情推进获得自我意识——引发伦理困境"
