manifest_version: 1
name: meta-isekai-dual
extension_point: story.genre
activation_events: ["on_genre:meta-isekai-dual"]
fusion:
  type: perspective_misalignment
  parent_genres: [isekai, book_transmigration]
  core_conflict: "两人都穿进同一本书，但信息差制造信任/背叛——谁是'角色'谁是'读者'？"
  fusion_formula: "穿书设定 + 双视角信息差 + 剧情操控博弈"
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "各自穿越→发现对方→试探合作→信息差博弈→联手or对决"
  power_system: "meta_knowledge"             # 剧情预知=核心能力
  emotion_arcs: [man_in_hole, cinderella]
  conflict_types:
    - {type: cognitive, weight: 0.4}         # 信息差博弈
    - {type: relational, weight: 0.3}        # 信任/背叛
    - {type: political, weight: 0.2}         # 改变剧情的连锁
    - {type: internal, weight: 0.1}          # 自我定位
  information_distribution: asymmetric_split # 双视角各自知道不同的事
  max_red_herrings: 3
  resolution_pattern: "信息差消除 + 共同选择改写结局"
  taboo_list:
    - "至少一个穿书者必须有合理理由不提前暴露身份"
    - "原著剧情不能被随意改动而不产生后果"
    - "不允许一方纯碾压——信息差必须双向"
  evaluation_weights:
    情节连贯: 0.25
    角色动机: 0.20
    对话真实度: 0.15
    设定一致性: 0.15
    套路检测: 0.10
    主题深度: 0.10
    感官细节: 0.05
  active_critics: [plot_coherence, character_motivation, dialogue_authenticity]
  fusion_specific_rules:
    reveal_timing: "双方互相发现的时机是关键反转点（建议中段）"
    canon_divergence: "每次偏离原著剧情，'世界修正力'会制造新障碍"
