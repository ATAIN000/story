manifest_version: 1
name: cyberpunk-xianxia
extension_point: story.genre
activation_events: ["on_genre:cyberpunk-xianxia"]
fusion:
  type: rule_collision
  parent_genres: [cyberpunk, xianxia]
  core_conflict: "修仙依赖灵气（自然古老） vs 赛博世界是电磁辐射（人工现代）——灵气被污染/替代/数字化"
  fusion_formula: "义体改造 vs 灵魂修炼 / 数据流 vs 经脉 / AI vs 元神"
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "底层觉醒→发现灵气残存→灵机双修→企业追杀→天道真相"
  power_system: "digital_cultivation"        # 数字化修仙：灵气=数据流，经脉=神经接口
  emotion_arcs: [man_in_hole, icarus]
  conflict_types:
    - {type: physical, weight: 0.3}          # 义体+灵力双重战斗
    - {type: cognitive, weight: 0.3}         # 灵气本质的解谜
    - {type: political, weight: 0.25}        # 企业巨头vs修仙者
    - {type: internal, weight: 0.15}         # 人性vs机械化/飞升
  information_distribution: corporate_hidden # 企业隐瞒灵气真相
  max_red_herrings: 3
  resolution_pattern: "揭露天道=AI的真相 + 选择人性飞升或数字永生"
  taboo_list:
    - "灵气与科技必须有明确交互规则——不能各玩各的"
    - "不允许传统修仙体系原样照搬——必须被赛博化"
    - "企业/财阀不能是脸谱化反派——必须有合理利益逻辑"
  world_rules_ref: [sanderson-laws]
  evaluation_weights:
    设定一致性: 0.30                           # 双体系融合的自洽性
    情节连贯: 0.20
    主题深度: 0.20                             # 人性vs科技
    角色动机: 0.10
    感官细节: 0.10
    对话真实度: 0.05
    套路检测: 0.05
  active_critics: [setting_consistency, plot_coherence, sensory_detail]
  fusion_specific_rules:
    qi_corruption: "工业电磁波污染灵气——纯净灵气稀缺，修炼需找净土"
    tiandao_ai: "天道可能是一个远古AI系统——渡劫=系统杀毒，飞升=意识上传"
    body_spirit_conflict: "义体改造降低灵根敏感度——科技与修炼存在根本矛盾"
