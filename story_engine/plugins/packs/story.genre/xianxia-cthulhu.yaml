manifest_version: 1
name: xianxia-cthulhu
extension_point: story.genre
activation_events: ["on_genre:xianxia-cthulhu"]
# 融合元数据（图鉴 §一 的4种冲突结构）
fusion:
  type: promise_subversion        # 承诺颠覆
  parent_genres: [xianxia, cosmic_horror]
  core_conflict: "修仙承诺长生超脱 → 克苏鲁框架下长生=疯狂，飞升=被吞噬"
  fusion_formula: "修炼体系(修仙) + 不可知恐惧(克苏鲁) → 力量的代价是人性"
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "凡人入门→诡异初现→越修越怖→认知崩溃→终极抉择"
  power_system: "eerie_cultivation"        # 诡异修仙：境界越高越接近不可名状
  emotion_arcs: [man_in_hole, riches_to_rags]  # 越强越绝望
  conflict_types:
    - {type: cognitive, weight: 0.4}       # 认知混乱：什么是真实？
    - {type: cosmic, weight: 0.35}         # 不可名状的威胁
    - {type: internal, weight: 0.25}       # 人性vs疯狂的内心战
  information_distribution: unreliable_narrator  # 主角自己分不清真实/虚幻
  max_red_herrings: 2
  resolution_pattern: "觉醒真相+付出代价（清醒的疯狂 or 痛苦的超脱）"
  taboo_list:
    - "不允许轻松愉快的修仙氛围——力量必有恐怖代价"
    - "不允许克苏鲁元素仅作装饰——必须颠覆修仙核心承诺"
    - "不可名状之物不可被完全理解或击败——只能逃避或同化"
  world_rules_ref: [sanderson-laws]        # 引用 world.rule 包
  evaluation_weights:
    设定一致性: 0.25                        # 两套世界观的逻辑自洽
    情节连贯: 0.20
    主题深度: 0.20                          # 认知/存在主义的深度
    角色动机: 0.15
    感官细节: 0.10                          # 诡异氛围
    对话真实度: 0.05
    套路检测: 0.05
  active_critics: [setting_consistency, plot_coherence, emotion_arc, sensory_detail]
  fusion_specific_rules:
    madness_threshold: "境界每升一级，疯狂值+1，超阈值触发认知崩溃事件"
    reality_flicker: "主角感知的现实偶尔与真实世界不一致（读者也分不清）"
