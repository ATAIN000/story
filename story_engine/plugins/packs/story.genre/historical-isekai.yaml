manifest_version: 1
name: historical-isekai
extension_point: story.genre
activation_events: ["on_genre:historical-isekai"]
fusion:
  type: value_inversion            # 价值倒置
  parent_genres: [isekai, historical_fiction, political_thriller]
  core_conflict: "现代平等观念 vs 古代等级制度；现代知识外挂 vs 历史惯性的不可逆"
  fusion_formula: "现代知识 + 古代权谋 + 历史进程的不可违抗性"
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "穿越落地→适应规则→利用知识→卷入权谋→改变or顺应历史"
  power_system: "modern_knowledge"           # 现代知识是唯一"金手指"
  emotion_arcs: [man_in_hole, cinderella]
  conflict_types:
    - {type: political, weight: 0.4}         # 朝堂权谋
    - {type: cognitive, weight: 0.3}         # 信息差利用
    - {type: relational, weight: 0.2}        # 人脉经营
    - {type: physical, weight: 0.1}          # 战争/暗杀
  information_distribution: asymmetric       # 主角知道历史走向，他人不知道
  max_red_herrings: 3
  resolution_pattern: "改变历史节点 + 承担蝴蝶效应后果"
  taboo_list:
    - "不允许现代知识万能——必须有时代局限性（技术无法落地）"
    - "不允许随意改变重大历史走向而不付出代价"
    - "古代角色不能太容易被现代思维说服——必须有文化惯性阻力"
  evaluation_weights:
    设定一致性: 0.25                           # 历史考据
    角色动机: 0.20
    情节连贯: 0.20
    主题深度: 0.15                             # 历史观探讨
    对话真实度: 0.10
    感官细节: 0.05
    套路检测: 0.05
  active_critics: [setting_consistency, character_motivation, plot_coherence, dialogue_authenticity]
  fusion_specific_rules:
    butterfly_effect: "每次改变历史都有连锁反应，必须在后续章节体现"
    knowledge_decay: "主角记忆的历史细节随时间推移可能失效（记忆模糊）"
