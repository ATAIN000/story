manifest_version: 1
name: horror-comedy
extension_point: story.genre
activation_events: ["on_genre:horror-comedy"]
fusion:
  type: value_inversion
  parent_genres: [horror, comedy]
  core_conflict: "恐惧 vs 欢笑——两种相反情绪的快速交替制造独特体验"
  fusion_formula: "恐怖氛围 + 搞笑角色/反应 + 恐惧和笑声的快速切换"
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "日常→灵异初现（搞笑反应）→升级→搞笑与恐怖交替→高潮（笑着尖叫）"
  power_system: "tonal_switch"                # 基调快速切换
  emotion_arcs: [man_in_hole]                 # 带反转
  conflict_types:
    - {type: cosmic, weight: 0.35}           # 真实的恐怖威胁
    - {type: physical, weight: 0.25}          # 生存/逃跑
    - {type: relational, weight: 0.25}        # 搞笑角色互动
    - {type: cognitive, weight: 0.15}         # 用脑洞应对恐怖
  information_distribution: absurd_reveal
  max_red_herrings: 1
  resolution_pattern: "用荒诞方式化解恐怖 + 留一个'其实没完'的尾巴"
  taboo_list:
    - "恐怖段落必须真恐怖——不能因为搞笑就削弱威胁感"
    - "搞笑不能消解恐怖的后果——死人是真死了"
    - "不允许全程搞笑或全程恐怖——必须是交替"
  evaluation_weights:
    对话真实度: 0.25                           # 搞笑对白
    情节连贯: 0.20
    感官细节: 0.15                             # 恐怖段落的氛围
    套路检测: 0.15                             # 脑洞新颖性
    角色动机: 0.10
    主题深度: 0.10
    设定一致性: 0.05
  active_critics: [dialogue_authenticity, plot_coherence, sensory_detail, cliche_detection]
  fusion_specific_rules:
    tonal_whiplash: "相邻段落必须基调反转——恐怖段后紧跟搞笑段，制造情绪落差"
    competent_fear: "恐怖威胁必须真实致命——搞笑角色是在真危险中耍宝，不是安全的闹剧"
