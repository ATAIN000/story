manifest_version: 1
name: sequence-pathway
extension_point: story.genre
activation_events: ["on_genre:sequence-pathway"]
fusion:
  type: rule_collision              # 规则对撞
  parent_genres: [progression_fantasy, cosmic_horror, steampunk]
  core_conflict: "升级承诺变强 → 力量本身是诅咒，每次晋升都在'变强'和'变成怪物'之间走钢丝"
  fusion_formula: "职业成长(网游) + 不可逆代价(恐怖) + 蒸汽朋克/科幻(美学)"
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "觉醒途径→序列9入门→逐级晋升→失控危机→序列0封神"
  power_system: "pathway_sequences"         # 序列途径：22条途径，每条9→0
  emotion_arcs: [cinderella, icarus]        # 崛起但伴随失控风险
  conflict_types:
    - {type: cognitive, weight: 0.3}        # 途径知识的解谜
    - {type: physical, weight: 0.3}         # 序列战斗
    - {type: internal, weight: 0.25}        # 失控风险
    - {type: political, weight: 0.15}       # 途径组织间的博弈
  information_distribution: gradual_reveal  # 途径知识逐步揭示
  max_red_herrings: 3
  resolution_pattern: "封神（序列0）+ 承担该途径的终极代价"
  taboo_list:
    - "不允许无代价升级——每个序列行为都有失控累积"
    - "不允许途径体系自相矛盾——22途径必须逻辑自洽"
    - "超凡材料获取必须有合理来源链"
  world_rules_ref: [sanderson-laws]
  evaluation_weights:
    设定一致性: 0.30                          # 序列体系的严密性
    情节连贯: 0.20
    角色动机: 0.15
    主题深度: 0.15                            # 人性vs神性
    对话真实度: 0.08
    感官细节: 0.07
    套路检测: 0.05
  active_critics: [setting_consistency, plot_coherence, character_motivation]
  fusion_specific_rules:
    loss_of_control: "每次使用超凡能力累积失控值，超阈值需'扮演'来稳定"
    acting_method: "角色必须持续'扮演'该序列的特质以维持理智"
