# 世界规则包：fair play 与本格底线
manifest_version: 1
name: fair-play
extension_point: world.rule
params:
  rules:
    - id: fair_play
      kind: bool
      desc: "叙述者不可为凶手（读者与侦探信息同步）"
      expr: "not(narrator_is_killer)"
    - id: no_late_clue
      kind: bool
      desc: "破案关键线索不得迟于揭晓章首次出现（伏笔必须先行）"
      expr: "not(is_resolution and introduces_new_key_clue)"
  source: manual
