manifest_version: 1
name: theme-depth
extension_point: story.evaluator
params:
  title: "主题深度"  # P9.1 中文显示名（id 仍为功能键，不变）
  dimension: theme_depth
  guide: |
    评估主题深度与表达方式（McKee 控制思想 + Show-don't-tell）：
    1. 主题存在——故事是否有一个可被提炼的核心命题？（关于权力/爱/正义/自由/身份……）
    2. 通过行动测试——主题是否被角色的选择和后果"测试"，而非通过角色念台词说出？
    3. 反命题呈现——是否呈现了与主题对立的观点？让读者自行判断，而非单向灌输？
    4. 升华——结局是否对主题有新的层次理解？而非简单重申开头的命题？
    5. 普世性——主题是否能超越具体故事，触及读者自身的人生体悟？

    FAIL 条件：
    - 故事无任何可被提炼的核心命题（纯事件流，无意义层）
    - 主题被角色直接念出来（"这个故事告诉我们……"式的说教）
    - 单向灌输，未呈现反方观点
    - 开头和结尾对主题的理解完全相同（无人物弧光/无认知升级）
  examples:
    pass: "全篇不提'正义'二字，但通过主角在每个抉择中的取舍，读者自己提炼出'正义不是惩罚而是修复'。"
    fail: "角色反复说「正义终将战胜邪恶」，但情节并未真正探讨正义的复杂性。"
  priority: after:cliche_detection
  blocking: false
