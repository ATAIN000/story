manifest_version: 1
name: pacing-rhythm
extension_point: story.evaluator
params:
  title: "节奏韵律"  # P9.1 中文显示名（id 仍为功能键，不变）
  dimension: pacing_rhythm
  guide: |
    评估叙事节奏与韵律质量：
    1. 章节内节奏——紧张段与缓冲段的交替是否合理？是否长期单调（全紧张无喘息 / 全铺垫无推进）
    2. 信息密度分布——关键信息是否扎堆（读者消化不了）或过度稀释（读者等不到重点）
    3. 句式韵律——短句快打、长句缓冲的交替。连续5句同长度 → 降分
    4. 场景时长 vs 戏剧价值——重要场景是否给了足够篇幅？次要场景是否过长？
    5. 章末钩子强度——每章结尾是否有足够的"续读驱动力"（扣子/悬念/反转）
    6. 全局节拍——参照 Save the Cat 15拍或本 genre 的 pacing_curve，检查是否在正确位置放了正确的事件

    FAIL 条件：
    - 连续3个段落都是同一种节奏（全快/全慢）
    - 重要转折只用了1-2段带过（戏剧价值与篇幅严重不匹配）
    - 章末无钩子，读者没有翻页冲动
    - 信息倾倒（info dump）超过连续3段
  examples:
    pass: "审案高潮（短句密集）→ 退堂后的独白（长句舒缓）→ 章末惊堂木又响（短钩子）——张弛有度。"
    fail: "从开头到结尾全是中速陈述句，既不紧张也不放松，像说明书一样平。"
  priority: after:plot_coherence
  blocking: false
