manifest_version: 1
name: foreshadowing-payoff
extension_point: story.evaluator
params:
  dimension: foreshadowing_payoff
  guide: |
    评估伏笔铺设与回收的质量（草蛇灰线法的质检版）：
    1. 伏笔隐蔽性——埋设时是否伪装成了"不经意的细节"？明显到读者一看就知道是伏笔 → 降分
    2. 间隔合理性——埋设与回收的间距是否足够长以制造"命运感"，又不至于长到读者已遗忘？
    3. 回收强度——回收时是否制造了"恍然大悟"？回看前文是否能找到至少2处暗示？
    4. 契诃夫之枪——重点描写的物件/信息是否在后文发挥了作用？未发挥作用 → 降分
    5. 伏笔回收比——埋了多少就回收多少。大量未回收的伏笔=挖坑不填 → 降分

    FAIL 条件：
    - 章节中重点描写的物件/人物/信息在全文中从未发挥作用（契诃夫之枪走火）
    - 伏笔回收时无法在前文找到任何暗示（凭空回收）
    - 埋设的伏笔明显到暴露作者意图（"此人惯用左手，将来必有蹊跷"）
    - 全文埋设了≥5个伏笔但回收率<60%
  examples:
    pass: "第3章闲笔写凶手倒茶惯用左手→第18章揭示伤口方向与左撇子吻合——隐蔽埋设+合理间隔+恍然大悟。"
    fail: "第3章写「这把剑将来必有大用」，第10章果然用了——伏笔过于直白，破坏隐蔽性。"
  priority: after:plot_coherence
  blocking: false
