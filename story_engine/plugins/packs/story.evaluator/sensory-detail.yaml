manifest_version: 1
name: sensory-detail
extension_point: story.evaluator
params:
  dimension: sensory_detail
  guide: |
    评估感官细节（Sensory Detail）的质量和密度：
    1. 多感官覆盖——场景是否调动了视觉之外的感官（听觉/触觉/嗅觉/味觉）？纯视觉描写 → 降分
    2. 细节具体性——感官描写是否用了具体意象而非笼统概括？（「空气中弥漫着一股若有若无的檀香味」vs「闻到了香味」）
    3. 细节功能性——每个感官细节是否服务于氛围/情绪/角色/情节？无功能的装饰性细节 → 降分
    4. 环境沉浸感——读者能否通过感官细节"进入"场景？是否有足够的锚点建立空间感
    5. Show-don't-tell——情绪/状态是否通过感官细节传达，而非直接告诉读者？

    FAIL 条件：
    - 整个场景只有视觉描写，零其他感官
    - 感官描写全部是笼统概括（「天气很好」「声音很大」）
    - 关键情绪节点完全靠 tell（「他很害怕」）而非 show（「他的手在发抖，后背的衣服已经被冷汗浸透」）
    - 场景缺少空间锚点，读者无法判断角色在何处
  examples:
    pass: "烛火被穿堂风压得几乎贴到了桌面，蜡油顺着铜台淌下来，在空气中拉出一股焦甜的气味。她后背靠着的墙壁透着地窖特有的阴凉。——调动了视觉、嗅觉、触觉，细节服务于紧张氛围。"
    fail: "房间里很暗，她感到有些害怕。——只有笼统的视觉概括和直接的情绪 tell，无具体感官细节。"
  priority: after:sensory
  blocking: false
