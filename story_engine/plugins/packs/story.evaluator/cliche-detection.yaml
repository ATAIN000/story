manifest_version: 1
name: cliche-detection
extension_point: story.evaluator
params:
  dimension: cliche_detection
  guide: |
    评估套路/陈词滥调的密度与创新度：
    1. 场景套路识别——是否使用了过度使用的场景模板？（霸道总裁壁咚/失忆/误会上床/车祸失忆……）
    2. 台词套路识别——是否有被用烂的台词？（「你给了我从未有过的感觉」「不要离开我」式直白表白）
    3. 角色套路识别——角色是否是扁平的刻板印象？（无脑恶毒女配/工具人朋友/纯坏反派）
    4. 反套路验证——如果用了套路，是否给出了反转/深化？（用了霸总设定但解构了霸总行为）
    5. 类型自觉——是否意识到自己在用套路并有意打破读者预期？

    FAIL 条件：
    - 连续2个场景都是高度可预测的套路化展开
    - 角色是纯粹的刻板印象，无任何个人化细节
    - 套路被原封不动地使用，无反转/深化/自觉
    - 关键转折使用了被用烂的廉价套路（失忆/双胞胎/一切都是梦）
  examples:
    pass: "用了'失忆'设定，但失忆的不是主角而是反派——反派忘了自己是反派，引发身份认同危机。套路被深化了。"
    fail: "主角被车撞了→失忆了→被男主收留→恢复记忆→原谅一切。100%套路流水线。"
  priority: after:theme_depth
  blocking: false
