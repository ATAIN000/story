manifest_version: 1
name: worldbuilding-coherence
extension_point: story.evaluator
params:
  title: "设定一致性"  # P9.1 中文显示名（id 仍为功能键，不变）
  dimension: worldbuilding_coherence
  guide: |
    评估世界观构建的内在一致性（与 setting_consistency 互补——后者管"本章场景自洽"，本维度管"全书世界自洽"）：
    1. 规则稳定性——世界的基本规则（物理/魔法/社会/经济）是否前后一致？随意变更 → FAIL
    2. 地理连贯——地点关系、距离、行程时间是否合理？前后矛盾 → FAIL
    3. 社会结构——阶层/组织/权力关系的设定是否被一致执行？
    4. 历史/传说——世界的历史背景是否前后呼应？不能在第3章说A，第10章说B
    5. 经济逻辑——物价、收入、交易是否符合世界设定？（不能主角随便拿出几万两银子却没人惊讶）
    6. 感官细节一致性——同一个地点的描写（天气、布局、气味）是否在不同章节保持一致？

    FAIL 条件：
    - 世界规则前后矛盾（第3章说灵气浓郁才能修炼，第10章灵气稀薄处也轻松修炼）
    - 地理错误（A城到B城第3章走三天，第10章一天就到）
    - 经济不自洽（物价体系混乱）
    - 已建立的世界设定被无理由违反
  examples:
    pass: "第2章交代从京城到边关需月余→第15章主角紧急驰援，期间确实花费了月余（或有合理加速手段并解释）。"
    fail: "第2章说修仙者不能飞，第15章主角突然飞起来了，没有任何解释。"
  priority: after:setting_consistency
  blocking: true
