manifest_version: 1
name: stakes-escalation
extension_point: story.evaluator
params:
  title: "代价升级"  # P9.1 中文显示名（id 仍为功能键，不变）
  dimension: stakes_escalation
  guide: |
    评估赌注/危机的递进质量（McKee 价值转折理论 + 通用叙事法则）：
    1. 单调递进——后段的危机是否比前段更重？出现"倒退"（后段比前段轻松）→ FAIL
    2. 赌注内化——危机是否从"外部威胁"升级为"主角核心价值观/身份的威胁"？
    3. 个人化——通用危机（拯救世界）是否最终落到主角个人身上（拯救自己在乎的人）？
    4. 不可逆性——每次升级是否关闭了一些退路？主角是否被一步步逼到"无路可退"？
    5. 代价真实性——每次胜利是否付出了真实代价？无代价的胜利 → 降分

    FAIL 条件：
    - 后段危机的规模/烈度低于前段（赌注倒退）
    - 主角始终可以轻松脱身（无"被逼到绝境"的时刻）
    - 关键胜利无任何代价（盟友伤亡/道德妥协/资源消耗）
    - 危机始终停留在抽象层面，未落到主角个人身上
  examples:
    pass: "逃命→保护同伴→对抗门派→正邪之战→发现自己师父才是真凶——赌注从肉体升级到信仰，每级都关上了退路。"
    fail: "第10章拯救世界，第20章又拯救世界，第30章还是拯救世界——规模相同，无递进。"
  priority: after:plot_coherence
  blocking: false
