manifest_version: 1
name: subtext-depth
extension_point: story.evaluator
params:
  dimension: subtext_depth
  guide: |
    评估潜台词深度（与 dialogue_authenticity 互补——后者管"像不像"，本维度管"深不深"）：
    1. 字面层 vs 意图层——角色说的话和真正想表达的是否不同？完全一致 → on-the-nose → 降分
    2. 冰山原则——关键信息是否藏在"未说出口"的部分？读者需要主动推理才领会？
    3. 权力微表情——对话中是否有微妙的支配/服从/反抗信号？（谁先开口、谁打断、谁沉默）
    4. 情感潜流——表面平静的对话下是否涌动着未表达的情感？
    5. 双关/暗指——是否在不破坏自然感的前提下埋设了双层含义？

    FAIL 条件：
    - 角色直白地说出自己的情感/动机（"我很伤心因为你离开了我"）
    - 整个场景所有对白都只有字面意义
    - 潜台词过于晦涩，读者完全无法领会（要的是"读者能感觉到但角色没说"，不是"完全猜不到"）
  examples:
    pass: "「你不用送了。」「路不好走。」——表面是送别礼仪，潜台词是「我不想你走」和「我想多陪一刻」。"
    fail: "「我内心深处其实一直爱着你，只是不敢说出口。」——把潜台词直接念出来了。"
  priority: after:dialogue_authenticity
  blocking: false
