# 题材插件：西幻史诗情缘（romance × high_fantasy，value_inversion 融合）
# 结构对齐 mystery.yaml / romance.yaml；内容自本包 fusion 元数据派生
manifest_version: 1
name: romantasy
extension_point: story.genre
activation_events: ["on_genre:romantasy"]
fusion:
  type: value_inversion
  parent_genres: [romance, high_fantasy]
  core_conflict: "爱情的私人性 vs 奇幻世界的史诗性/危险性；个人幸福 vs 世界命运"
  fusion_formula: "言情情感线 + 奇幻世界观 + 龙骑士/魔法学院/战争设定"

culture_bound: false
allowed_cultures: ["*"]

params:
  title: "西幻言情"  # P9.1 中文显示名（id 仍为功能键，不变）
  pacing_curve: "相遇（冲突背景）→被迫接近→情感升温→世界危机→爱情与使命的抉择"
  power_system: "fantasy_magic"              # 魔法/龙骑士/学院体系
  emotion_arcs: [cinderella, man_in_hole]
  conflict_types:
    - {type: relational, weight: 0.4}        # 情感主线
    - {type: physical, weight: 0.25}         # 战争/危险
    - {type: political, weight: 0.2}         # 阶级/阵营
    - {type: internal, weight: 0.15}         # 爱情vs使命
  information_distribution: dual_layer       # 情感线+世界线双线推进
  max_red_herrings: 2
  resolution_pattern: "爱情与世界两全（or 为一方牺牲另一方）"
  main_track: A
  theme_track: E
  payoff_window: 3
  beats_per_chapter: 5

  # 五轨道（Showrunner 调度对象 — 自 core_conflict/fusion_formula 推导：
  # 战火情愫主线 + 王国战事逼近 + 身份鸿沟拉扯 + 学院龙骑团日常单元 + 私心与天下主题）
  tracks:
    - {id: A, name: "主线·战火中的情愫与使命", arc_type: Serialized, archetype: Quest,   progress: 0.0, last_touched: 0}
    - {id: B, name: "副线·王国战事的逼近",     arc_type: Serialized, archetype: Monster,  progress: 0.0, last_touched: 0}
    - {id: C, name: "副线·身份鸿沟的拉扯",     arc_type: Serialized, archetype: Tragedy, progress: 0.0, last_touched: 0}
    - {id: D, name: "单元剧·学院与龙骑团日常", arc_type: Anthology,  archetype: Quest,    progress: 0.0, last_touched: 0, min_main_progress: 0.3}
    - {id: E, name: "主题·私心与天下能否两全", arc_type: Serialized, archetype: Rebirth,  progress: 0.0, last_touched: 0}

  rule_packs: [romance-taboo, sanderson-laws]  # 原 world_rules_ref 改名（P7.4 L5 引用合并）
  # 世界规则（Z3 SMT 硬约束 — expr 限事实词汇表）
  world_rules:
    - id: magic_not_deus_ex
      kind: bool
      desc: "魔法非解围咒：终局不得靠突发神力直接化解情感与战事的死结"
      expr: "not(has_supernatural and is_resolution)"
    - id: bond_earned
      kind: bool
      desc: "羁绊兑现律：终局的关系飞跃不得依赖未铺垫的血统或预言"
      expr: "not(is_resolution and introduces_new_key_clue)"

  # 伏笔模板（Showrunner 种子计划用）
  foreshadow_templates:
    - {content: "龙不肯认主的反常",     trigger: "龙在她面前低下头颅",   payoff: "认主之谜指向她被封印的血脉"}
    - {content: "古籍里被撕去的一页",   trigger: "抄本在敌国王宫重现",   payoff: "撕页内容是扭转战局的关键"}
    - {content: "他血脉里不该有的印记", trigger: "印记在月圆之夜灼痛",   payoff: "印记牵出两大王国同源的旧约"}

  taboo_list:
    - "情感线不能被世界线淹没——偏爱心动戏的读者是核心受众"
    - "不允许感情发展无铺垫——必须有推拉过程"
    - "魔法与奇幻元素不能喧宾夺主——必须服务于情感张力"

  evaluation_weights:
    角色动机: 0.31
    情节连贯: 0.19
    对话真实度: 0.19                           # 情侣对白
    设定一致性: 0.12
    感官细节: 0.13
    套路检测: 0.06

  active_critics: [character_motivation, emotion_arc, plot_coherence, dialogue_authenticity]

  fusion_specific_rules:
    spice_level: "可调（clean→spicy），影响目标受众"
    fantasy_depth: "奇幻深度可调（装饰性→硬核），影响世界观构建量"

  # prompt 段：role/setting/characters/style/hard_requirements 五键
  prompt:
    role: "西幻史诗言情小说作者"
    setting: "龙与魔法的架空大陆：两大王国交战之际，边境龙骑团与王都魔法学院被迫结盟，盟约把最不可能的两个人捆在了一起"
    characters: "伊莱娜（魔法学院最年轻的导师，身负被封印的血脉，清醒自持）、卡西安（龙骑团团长，骄傲的王国之刃，他的龙只肯听她的话）、摄政王（以和平为名的棋手，笑容里全是筹码）"
    style: "800-1200字，史诗质感与心跳细节并重，战场的号角声里听得见呼吸"
    hard_requirements:
      - "感情推进必须有推拉过程：并肩、试探、退让、再靠近，禁止一见倾心直达圆满"
      - "魔法有代价、有规矩：每一次施法都要付出可感的成本"
      - "世界线再宏大也不得淹没情感线——每章至少一处心动的具体细节"
      - "魔法不得直接解开情感或战事的死结——抉择必须由人来做"

  # phase_beats：Todorov 5 态（并肩—抉择—两全结构，primitive 限八种原语）
  phase_beats:
    equilibrium:
      - {id: two_worlds, desc: "阵营与身份：她是学院之光，他是王国之刃", primitive: GoalFormation}
    disruption:
      - {id: forced_bond, desc: "被迫并肩：战事或盟约把两人捆在一起", primitive: TurningPoint}
      - {id: dragons_favor, desc: "他的龙只认她——无法解释的亲昵", primitive: Suspense}
    recognition:
      - {id: feelings_named, desc: "心意为彼此所觉，立场却不容", primitive: Recognition}
      - {id: world_crisis_breaks, desc: "世界危机总爆发：私情撞上存亡", primitive: Conflict}
    repair:
      - {id: price_of_love, desc: "为对方或为世界付出的代价", primitive: Sacrifice}
      - {id: fate_revealed, desc: "血脉与战局的真相揭晓", primitive: Revelation}
    new_equilibrium:
      - {id: love_and_world, desc: "私心与天下两全（或壮烈的二选一）", primitive: Recognition}
      - {id: far_realm_hook, desc: "尾声留扣：新大陆另一端的异动", primitive: Suspense}

  # blend_domains：跨域融合的领域池
  blend_domains: ["龙骑士团建制", "魔法学院体系", "王国战事与盟约"]

  # pacing_targets：键名对齐 PacingScore 四字段，值为 [min, max] 区间
  pacing_targets:
    reversal_density: [0.2, 0.5]
    avg_reversal_magnitude: [0.3, 0.6]
    pacing_consistency: [0.6, 0.9]
    cliffhanger_strength: [0.5, 0.8]
