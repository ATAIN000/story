# 题材插件：游戏入侵现实（litrpg × reality_distortion，rule_collision 融合）
# 结构对齐 mystery.yaml / romance.yaml；内容自本包 fusion 元数据派生
manifest_version: 1
name: game-reality-invasion
extension_point: story.genre
activation_events: ["on_genre:game-reality-invasion"]
fusion:
  type: rule_collision
  parent_genres: [litrpg, reality_distortion]
  core_conflict: "游戏规则（可复活有数值任务驱动） vs 现实（死亡不可逆情感真实）——'死亡'的定义被模糊"
  fusion_formula: "游戏化规则 + 现实后果 + 'NPC/玩家'身份错位"

culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: "游戏启动→规则入侵现实→NPC觉醒/玩家被困→身份真相→终极抉择"
  power_system: "game_reality_blend"          # 游戏机制在现实中生效
  emotion_arcs: [man_in_hole, oedipus]
  conflict_types:
    - {type: cognitive, weight: 0.3}         # 规则破解
    - {type: physical, weight: 0.25}         # 游戏化战斗
    - {type: internal, weight: 0.25}         # 现实vs游戏身份认同
    - {type: relational, weight: 0.2}        # NPC的人性
  information_distribution: rule_discovery
  max_red_herrings: 3
  resolution_pattern: "打破游戏vs现实的边界 + 回答'什么是真实'"
  main_track: A
  theme_track: E
  payoff_window: 2
  beats_per_chapter: 4

  # 五轨道（Showrunner 调度对象 — 自 core_conflict/fusion_formula 推导：
  # 现实防线主线 + 玩家阵营博弈 + 觉醒者单元 + 现实伤亡代价 + 何为真实主题）
  tracks:
    - {id: A, name: "主线·规则侵蚀与现实防线", arc_type: Serialized, archetype: Quest,   progress: 0.0, last_touched: 0}
    - {id: B, name: "副线·玩家阵营的排位博弈", arc_type: Serialized, archetype: Monster,  progress: 0.0, last_touched: 0}
    - {id: C, name: "单元剧·觉醒者档案",       arc_type: Anthology,  archetype: Rebirth,  progress: 0.0, last_touched: 0, min_main_progress: 0.3}
    - {id: D, name: "副线·现实伤亡的代价",     arc_type: Serialized, archetype: Tragedy,  progress: 0.0, last_touched: 0}
    - {id: E, name: "主题·何为真实",           arc_type: Serialized, archetype: Quest,    progress: 0.0, last_touched: 0}

  # 世界规则（Z3 SMT 硬约束 — expr 限事实词汇表）
  world_rules:
    - id: death_permanence
      kind: bool
      desc: "现实死亡律：游戏机制（超自然）不得直接改写现实死亡作为收束"
      expr: "not(has_supernatural and is_resolution)"
    - id: awakening_seeded
      kind: bool
      desc: "觉醒有源：结局章不得凭空引入未铺垫的关键设定"
      expr: "not(is_resolution and introduces_new_key_clue)"

  # 伏笔模板（Showrunner 种子计划用）
  foreshadow_templates:
    - {content: "NPC台词的脚本化重复",   trigger: "重复台词某天出现偏差", payoff: "偏差即自我意识的萌芽"}
    - {content: "死亡玩家未注销的账号", trigger: "账号深夜独自上线",     payoff: "牵出'复活'机制的真实代价"}
    - {content: "系统公告的措辞漏洞",   trigger: "公告与现实结果不符",   payoff: "措辞暴露主控方的真实意图"}

  taboo_list:
    - "游戏规则入侵现实必须有明确机制——不能随意"
    - "NPC必须有'人化'过程——不能纯工具"
    - "现实中的死亡必须有重量——不能像游戏一样轻率"

  evaluation_weights:
    设定一致性: 0.25
    情节连贯: 0.20
    主题深度: 0.20                             # 何为真实/何为人
    角色动机: 0.15
    对话真实度: 0.10
    感官细节: 0.05
    套路检测: 0.05

  active_critics: [setting_consistency, plot_coherence, character_motivation]

  fusion_specific_rules:
    death_permanence: "现实中的死亡不可复活——游戏机制不覆盖死亡"
    npc_awakening: "NPC随剧情推进获得自我意识——引发伦理困境"

  # prompt 段：role/setting/characters/style/hard_requirements 五键
  prompt:
    role: "游戏入侵现实题材小说作者"
    setting: "近未来都市，爆款全息游戏《深界》停服之夜，任务弹窗开始出现在真实街道——机制渗入现实，死亡却不再读档"
    characters: "江离（前职业选手，如今的外卖员，冷静务实）、阿芽（游戏向导NPC，言行逐渐偏离脚本）、韩恕（排行榜第一公会会长，把现实当作新赛季）"
    style: "800-1200字，冷硬写实与系统提示音交织，数值与代价都落到实处"
    hard_requirements:
      - "游戏机制入侵现实必须有可见规则与触发条件，禁止随意开挂"
      - "现实中的死亡不可逆；任何'复活'都必须付出现实侧的代价"
      - "NPC的人化必须渐进：先是脚本偏差，再是自我主张，禁止一夜觉醒"

  # phase_beats：Todorov 5 态（规则渗入—边界抉择结构，primitive 限八种原语）
  phase_beats:
    equilibrium:
      - {id: daily_grind, desc: "现实生计与游戏日常的双线铺垫", primitive: GoalFormation}
    disruption:
      - {id: rule_leak, desc: "规则渗入：首个任务弹窗出现在真实街道", primitive: TurningPoint}
      - {id: first_real_death, desc: "第一起无法读档的现实死亡", primitive: Suspense}
    recognition:
      - {id: npc_deviation, desc: "NPC言行出现脚本之外的偏差", primitive: Revelation}
      - {id: players_turn, desc: "玩家阵营为现实资源反目", primitive: Betrayal}
    repair:
      - {id: exploit_counter, desc: "破解规则漏洞，反制系统进程", primitive: Conflict}
      - {id: save_or_keep, desc: "在'救觉醒者'与'保现实秩序'之间抉择", primitive: Sacrifice}
    new_equilibrium:
      - {id: boundary_reset, desc: "边界暂时稳住，'真实'的定义被改写", primitive: Recognition}
      - {id: next_patch, desc: "尾声留扣：下一轮系统更新的倒计时", primitive: Suspense}

  # blend_domains：跨域融合的领域池
  blend_domains: ["电竞职业生态", "外卖零工经济", "MMO任务设计"]

  # pacing_targets：键名对齐 PacingScore 四字段，值为 [min, max] 区间
  pacing_targets:
    reversal_density: [0.3, 0.6]
    avg_reversal_magnitude: [0.4, 0.7]
    pacing_consistency: [0.5, 0.8]
    cliffhanger_strength: [0.6, 0.9]
