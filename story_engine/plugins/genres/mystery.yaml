# 题材插件：悬疑侦破（蓝图 Module 0.3 示例的可运行版）
manifest_version: 1
name: mystery
extension_point: story.genre
activation_events: ["on_genre:mystery"]

# 【v3.0 赌注2修正】culture_bound 标记：false=可自由组合任意 Culture
culture_bound: false
allowed_cultures: ["*"]

params:
  pacing_curve: slow_burn
  emotion_arcs: [man_in_hole, cinderella, icarus]
  information_distribution: fair_play
  max_red_herrings: 3
  resolution_pattern: "真相揭示+正义"
  main_track: A
  theme_track: E
  payoff_window: 2
  beats_per_chapter: 4

  # 五轨道（Showrunner 调度对象）
  tracks:
    - {id: A, name: "主线·玉佩案侦破", arc_type: Serialized, archetype: Quest,   progress: 0.0, last_touched: 0}
    - {id: B, name: "刘伯弧·管家秘密", arc_type: Serialized, archetype: Tragedy, progress: 0.0, last_touched: 0}
    - {id: C, name: "展昭弧·侠与法",   arc_type: Serialized, archetype: Rebirth, progress: 0.0, last_touched: 0}
    - {id: D, name: "单元剧·案中案",   arc_type: Anthology,  archetype: Monster, progress: 0.0, last_touched: 0, min_main_progress: 0.7}
    - {id: E, name: "主题·律法与情",   arc_type: Serialized, archetype: Quest,   progress: 0.0, last_touched: 0}

  # 世界规则（Z3 SMT 硬约束 — 赌注1验证通过）
  world_rules:
    - id: sanderson_1
      kind: bool
      desc: "Sanderson第一律：鬼神介入不解决剧情"
      expr: "not(has_supernatural and is_resolution)"
    - id: fair_play
      kind: bool
      desc: "Fair Play：叙述者不可为凶手"
      expr: "not(narrator_is_killer)"
    - id: case_aging
      kind: arith
      desc: "案件时效：结案不超过365天"
      expr: "case_age_days <= 365"

  # 伏笔模板（Showrunner 种子计划用）
  foreshadow_templates:
    - {content: "目击者的矛盾证词", trigger: "交叉质询", payoff: "证词破绽指向真凶"}
    - {content: "案发现场的异常物件", trigger: "复勘现场", payoff: "物件归属揭示嫌疑人"}
    - {content: "受害者的未了心事", trigger: "家属回忆", payoff: "动机链条补全"}

  taboo_list:
    - "不允许超自然解"
    - "不允许凶手=叙述者(除非fair play)"

  evaluation_weights:
    情节连贯: 0.20
    角色动机: 0.15
    设定一致性: 0.25
    对话真实度: 0.10
    感官细节: 0.10
    套路检测: 0.10
    主题深度: 0.10

  # 【v3.0 赌注5修正】critic 维度按类型裁剪 — 悬疑只需 4 维
  active_critics: [plot_coherence, character_motivation, setting_consistency, cliche_detection]

  # 【P3 决策8】prompt 段：role/setting/characters/style/hard_requirements 五键
  # （文案逐字迁自原 engine.py `_real_generate_prompt` 写死文案，不改写防输出漂移；
  #   引擎渲染时在 hard_requirements 后追加引擎级约定：章末钩子 + 首行标题格式）
  prompt:
    role: "公案小说作者"
    setting: "北宋，包拯开封府断案，当前侦破「玉佩失窃案」"
    characters: "包拯（府尹，沉毅寡言）、展昭（护卫，利落）、公孙策（师爷，缜密）、刘伯（王府管家，恭谨藏怯）、王员外（苦主）"
    style: "800-1200字，文白相间，叙事节奏如评书"
    hard_requirements:
      - "包拯断案只依据已经合法确立的证据与证词，绝不可说出未交代来源的信息"
      - "禁用超自然力量直接破案（梦兆/冤魂只能渲染氛围）"

  # 【P3 决策6】phase_beats：Todorov 5 态 → beat 规格列表，beat 带 primitive 提示键
  # （侦破结构：悬念先行、双次揭示收束，与 romance 的情感弧线序列真实不同）
  phase_beats:
    equilibrium:
      - {id: case_open, desc: "案发前的日常与委托人登场", primitive: GoalFormation}
    disruption:
      - {id: crime_surface, desc: "案件浮出：失窃/命案震动一方", primitive: Suspense}
      - {id: suspect_clash, desc: "嫌疑人互相攻讦，矛盾激化", primitive: Conflict}
    recognition:
      - {id: clue_reveal, desc: "关键线索被揭开，指向真凶", primitive: Revelation}
      - {id: red_herring, desc: "烟雾弹：假线索误导侦破方向", primitive: Betrayal}
    repair:
      - {id: culprit_unmask, desc: "对质识破：真凶身份与手法被看穿", primitive: Recognition}
      - {id: last_gambit, desc: "真凶反扑或灭证，局势逆转", primitive: TurningPoint}
    new_equilibrium:
      - {id: justice_served, desc: "真相大白，律法昭彰", primitive: Revelation}
      - {id: lingering_shadow, desc: "尾声留扣：未解的余波", primitive: Suspense}
