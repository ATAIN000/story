# 题材插件：武侠 —【v3.0 赌注2修正】Culture-bound genre 示例
# 验证证明：武侠的"江湖规则"嵌入中国文化，无法完全正交分解
# 处理：标记 culture_bound=true，预绑定 Culture 白名单，不允许自由组合
manifest_version: 1
name: wuxia
extension_point: story.genre
activation_events: ["on_genre:wuxia"]

culture_bound: true
# P22 幽灵文化 taoist_chinese → 已注册的 jianghu-martial
allowed_cultures: [confucian_officialdom, jianghu-martial]

params:
  title: "武侠江湖"  # P9.1 中文显示名（id 仍为功能键，不变）
  pacing_curve: "隐忍→寻师→历练→恩怨→对决"
  power_system: martial_arts
  social_space: jianghu
  conflict_types:
    - {type: relational, weight: 0.4}
    - {type: physical, weight: 0.4}
    - {type: cognitive, weight: 0.2}
  resolution_pattern: "恩怨了结/归隐/传承"
  main_track: A
  theme_track: E
  payoff_window: 3
  beats_per_chapter: 4
  emotion_arcs: [rise, fall_rise, oedipus]
  tracks:
    - {id: A, name: "主线·恩怨", arc_type: Serialized, archetype: Quest, progress: 0.0, last_touched: 0}
    - {id: B, name: "师徒弧·传承", arc_type: Serialized, archetype: Rebirth, progress: 0.0, last_touched: 0}
    - {id: E, name: "主题·侠与规矩", arc_type: Serialized, archetype: Quest, progress: 0.0, last_touched: 0}
  world_rules:
    - id: sanderson_1
      kind: bool
      desc: "Sanderson第一律：鬼神介入不解决剧情"
      expr: "not(has_supernatural and is_resolution)"
  taboo_list:
    - "不允许现代武器"
    - "武功不能超出设定上限"
  foreshadow_templates:
    - {content: "师父的欲言又止", trigger: "身份揭晓", payoff: "身世之谜"}
  active_critics: [character_motivation, setting_consistency, plot_coherence, emotion_arc]

  # P22：补齐 H7 门禁三段（prompt/phase_beats/evaluation_weights）
  evaluation_weights:
    情节连贯: 0.25
    设定一致性: 0.20
    角色动机: 0.15
    对话真实度: 0.15
    主题深度: 0.10
    套路检测: 0.10
    感官细节: 0.05
  prompt:
    role: "武侠小说作者"
    setting: "架空古代江湖，门派林立，恩怨分明，武功有明确传承与上限"
    characters: "主角（身负恩怨的江湖客）、师父/对手/同道（依本章决策卡阵容）"
    style: "800-1200字，白描硬派，招式与规矩并重"
    hard_requirements:
      - "武功不得超出设定上限，胜负须有铺垫"
      - "江湖规矩一旦立下就必须被遵守，违背须付出代价"
      - "禁用现代器物与超自然力量直接破局"
  phase_beats:
    equilibrium:
      - {id: jianghu_daily, desc: "门派日常与恩怨前史", primitive: GoalFormation}
    disruption:
      - {id: grudge_sparks, desc: "恩怨引爆或师门遭变", primitive: TurningPoint}
    recognition:
      - {id: truth_of_grudge, desc: "恩怨真相与幕后浮现", primitive: Revelation}
    repair:
      - {id: training_cost, desc: "历练与代价，武学突破", primitive: Sacrifice}
      - {id: duel_setup, desc: "约战与规矩确认", primitive: Conflict}
    new_equilibrium:
      - {id: duel_settle, desc: "对决了断，恩怨两清", primitive: Recognition}
      - {id: next_hook, desc: "新的江湖风波钩子", primitive: Suspense}
