# 题材插件：末日言情（post_apocalyptic × romance，value_inversion 融合）
# 结构对齐 mystery.yaml / romance.yaml；内容自本包 fusion 元数据派生
manifest_version: 1
name: apocalypse-romance
extension_point: story.genre
activation_events: ["on_genre:apocalypse-romance"]
fusion:
  type: value_inversion
  parent_genres: [post_apocalyptic, romance]
  core_conflict: "末日生存的残酷 vs 爱情的柔软——'明天可能死'让感情极致珍贵"
  fusion_formula: "生存压力 + 资源争夺 + 极端环境下的情感 + 重生预知"

culture_bound: false
allowed_cultures: ["*"]

params:
  title: "末日情缘"  # P9.1 中文显示名（id 仍为功能键，不变）
  pacing_curve: "末日降临→求生相遇→被迫同行→生死羁绊→建立庇护→情感确认"
  power_system: "survival_scavenging"        # 生存技能+资源管理
  emotion_arcs: [man_in_hole, cinderella]
  conflict_types:
    - {type: physical, weight: 0.35}         # 生存/战斗
    - {type: relational, weight: 0.35}       # 情感主线
    - {type: resource, weight: 0.2}          # 物资争夺
    - {type: internal, weight: 0.1}          # 活着的意义
  information_distribution: reborn_foresight  # 重生者预知灾变节点
  max_red_herrings: 2
  resolution_pattern: "建立安全区 + 情感落地（或为对方牺牲）"
  main_track: A
  theme_track: E
  payoff_window: 3
  beats_per_chapter: 5

  # 五轨道（Showrunner 调度对象 — 自 core_conflict/fusion_formula 推导：
  # 求生主线 + 资源争夺 + 生死情感 + 单元避难者故事 + 活着的意义）
  tracks:
    - {id: A, name: "主线·废土求生与庇护所", arc_type: Serialized, archetype: Quest,   progress: 0.0, last_touched: 0}
    - {id: B, name: "副线·资源争夺与匪帮",   arc_type: Serialized, archetype: Monster,  progress: 0.0, last_touched: 0}
    - {id: C, name: "副线·生死羁绊之情",     arc_type: Serialized, archetype: Rebirth,  progress: 0.0, last_touched: 0}
    - {id: D, name: "单元剧·避难者故事",     arc_type: Anthology,  archetype: Tragedy,  progress: 0.0, last_touched: 0, min_main_progress: 0.5}
    - {id: E, name: "主题·活着的意义",       arc_type: Serialized, archetype: Rebirth,  progress: 0.0, last_touched: 0}

  rule_packs: [romance-taboo]  # 原 world_rules_ref 改名（P7.4 L5 引用合并）
  # 世界规则（Z3 SMT 硬约束 — expr 限事实词汇表）
  world_rules:
    - id: survival_no_miracle
      kind: bool
      desc: "末日无奇迹：超自然力量/重生预知不得直接化解生存危机作为收束"
      expr: "not(has_supernatural and is_resolution)"
    - id: foresight_bounded
      kind: bool
      desc: "预知有界：结局章不得凭空引入前世记忆外的关键信息（灾变有不可预测变量）"
      expr: "not(is_resolution and introduces_new_key_clue)"

  # 伏笔模板（Showrunner 种子计划用）
  foreshadow_templates:
    - {content: "重生记忆中的灾变时间点", trigger: "预知与现实出现偏差", payoff: "变量暴露，预示更大危机"}
    - {content: "对方贴身携带的旧物",   trigger: "旧物来历被揭开",     payoff: "牵出两人前世今生的交集"}
    - {content: "庇护所规章的漏洞",     trigger: "外人闯入或内鬼作乱", payoff: "漏洞指向内鬼身份"}

  taboo_list:
    - "末日环境必须真实残酷——不能为甜宠削弱生存压力"
    - "感情发展必须有生死考验驱动——不能无理由发糖"
    - "重生预知不能万能——灾变有不可预测的变量"

  evaluation_weights:
    角色动机: 0.27
    感官细节: 0.27                             # 末日氛围
    情节连贯: 0.20
    设定一致性: 0.13
    对话真实度: 0.07
    套路检测: 0.06

  active_critics: [emotion_arc, character_motivation, sensory_detail, plot_coherence]

  fusion_specific_rules:
    death_stakes: "配角/重要NPC必须有人死亡——维持末日真实感"
    reborn_variant: "建议含重生线：主角重生回末日前的关键选择点"

  # prompt 段：role/setting/characters/style/hard_requirements 五键
  prompt:
    role: "末日言情小说作者"
    setting: "近未来灾变后的废土城市：秩序崩塌、物资配给，幸存者在废墟中筑起的庇护所；主角带着前世记忆重生回灾变前夜"
    characters: "沈昭（重生者，前世死于围城之夜的急诊医生，冷静而怕再失去）、陆则（前救援队长，庇护所首领，冷硬务实）、商陆（黑市物资头目，笑面谈判，亦敌亦友）"
    style: "800-1200字，粗粝冷峻的末日质感与细腻情感交织，生存细节写实"
    hard_requirements:
      - "生存压力必须真实：食物、药品、安全每时每刻都是问题"
      - "感情推进必须由生死考验驱动，禁止无事件支撑的发糖"
      - "重生预知有时有界：灾变节点存在前世未曾经历的变量"
      - "重要配角会死亡，末日不给人人团圆的廉价结局"

  # phase_beats：Todorov 5 态（求生—羁绊结构，primitive 限八种原语）
  phase_beats:
    equilibrium:
      - {id: daily_scavenge, desc: "灾变日常：觅食、警戒与庇护所秩序", primitive: GoalFormation}
    disruption:
      - {id: disaster_strike, desc: "灾变节点降临：物资点被袭或瘟疫蔓延", primitive: Suspense}
      - {id: forced_together, desc: "被迫同行：生死关头把后背交给对方", primitive: TurningPoint}
    recognition:
      - {id: foresight_gap, desc: "重生预知与现实出现偏差的裂缝", primitive: Revelation}
      - {id: trust_fracture, desc: "资源分配引发信任危机甚至背叛", primitive: Betrayal}
    repair:
      - {id: sacrifice_choice, desc: "为对方挡灾或让出生机的抉择", primitive: Sacrifice}
      - {id: safehaven_hold, desc: "合力击退威胁，守住庇护所", primitive: Conflict}
    new_equilibrium:
      - {id: bond_confirmed, desc: "安全区立足，情感落地确认", primitive: Recognition}
      - {id: next_storm, desc: "尾声留扣：下一场灾变的预兆", primitive: Suspense}

  # blend_domains：跨域融合的领域池
  blend_domains: ["急救医学", "废土求生", "以物易物黑市"]

  # pacing_targets：末日言情反转与钩子强度高（生存线），一致性中档
  pacing_targets:
    reversal_density: [0.3, 0.6]
    avg_reversal_magnitude: [0.4, 0.7]
    pacing_consistency: [0.5, 0.8]
    cliffhanger_strength: [0.6, 0.9]
