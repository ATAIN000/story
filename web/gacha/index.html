<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryOS 开局抽卡</title>
<style>
  :root {
    --bg: #0d1117; --card: #12161d; --line: #232a35;
    --ink: #e6e9ee; --ink2: #94a0ac;
    --grad: linear-gradient(90deg, #ff5f6d, #ffb35c, #f7e96b, #5fd08a, #5aa7ff, #b07cff);
    --grad-v: linear-gradient(180deg, #ff5f6d, #ffb35c, #f7e96b, #5fd08a, #5aa7ff, #b07cff);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #2b333f var(--bg); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2b333f; border-radius: 6px; }
  ::selection { background: rgba(90, 167, 255, 0.28); color: #fff; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Arial;
    line-height: 1.7; padding: 48px 16px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-size: 24px; font-weight: 600; letter-spacing: 0.2em;
    text-align: center; color: #eef2f6;
    font-family: 'Noto Sans SC','Microsoft YaHei',-apple-system,sans-serif;
    animation: rise .8s ease both;
  }
  /* 主站同款彩虹波：尺寸收窄居中，hue-rotate 让 6 色渐变流转 */
  .rainbow {
    display: block; width: min(420px, 62vw); height: auto; margin: 8px auto 10px;
    overflow: visible; animation: rise .8s .12s ease both, hueflow 5s linear infinite;
  }
  @keyframes hueflow { to { filter: hue-rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  .hueflow { animation: hueflow 6s linear infinite; }
  .sub {
    text-align: center; color: var(--ink2); font-size: 13px;
    letter-spacing: 0.05em; margin-bottom: 28px;
    animation: rise .8s .2s ease both;
  }
  .roll-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px; font-size: 18px; font-weight: 600; letter-spacing: 0.1em;
    font-family: inherit; color: var(--ink); cursor: pointer; margin-bottom: 16px;
    border: 1px solid transparent; border-radius: 12px;
    background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box;
    transition: box-shadow 200ms ease;
  }
  .roll-btn:hover { box-shadow: 0 0 12px rgba(90, 167, 255, 0.25); }
  .roll-btn:active { transform: scale(0.98); }
  .roll-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .roll-btn svg, .btn svg, .tab-lock svg, .fav-btn svg, .mystic-toggle svg, .rec-mini svg { display: block; flex-shrink: 0; }
  /* 今日黄历：抽卡按钮上方一行灰字，纯展示 */
  .almanac {
    text-align: center; color: #5c6b7a; font-size: 12px;
    letter-spacing: 0.05em; margin: -16px 0 10px;
  }
  /* 玄学加成折叠区 */
  .mystic { margin-bottom: 16px; }
  .mystic-toggle {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 7px; font-size: 12px; color: var(--ink2);
    background: none; border: 1px dashed var(--line); border-radius: 8px;
    cursor: pointer; font-family: inherit; letter-spacing: 0.08em;
    transition: border-color 150ms ease, color 150ms ease;
  }
  .mystic-toggle:hover { border-color: #38424f; color: var(--ink); }
  .mystic-toggle .chev { display: inline-flex; transition: transform 150ms ease; }
  .mystic-toggle.open .chev { transform: rotate(180deg); }
  .mystic-body { padding: 12px 2px 0; }
  .mystic-note { color: #5c6b7a; font-size: 11px; text-align: center; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip {
    padding: 3px 12px; font-size: 12px; color: var(--ink2); cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    font-family: inherit; transition: color 150ms ease, border-color 150ms ease;
  }
  .chip:hover { border-color: #38424f; color: var(--ink); }
  .chip.active {
    color: var(--ink); border: 1px solid transparent;
    background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box;
  }
  /* hero 卡右上角收藏星钮 */
  .fav-btn {
    position: absolute; top: 10px; right: 10px; border: none; background: none;
    cursor: pointer; padding: 4px; color: var(--ink2); line-height: 0;
    transition: color 150ms ease;
  }
  .fav-btn:hover { color: var(--ink); }
  .fav-btn.on { color: #f7e96b; }
  .fav-btn.pop { animation: pop 150ms ease-out; }
  /* 玄学批注区：hero 卡下方，选中星座且有结果时显示 */
  .fortune {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; margin-bottom: 14px; font-size: 13px; color: var(--ink2);
    text-align: center;
  }
  .fortune .stars { color: #f7e96b; letter-spacing: 0.15em; margin-right: 8px; }
  /* 记录面板（历史/收藏） */
  .rec-panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-top: 12px;
  }
  .rec-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .rec-tab {
    flex: 1; padding: 5px; font-size: 13px; color: var(--ink2); cursor: pointer;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; transition: color 150ms ease, border-color 150ms ease;
  }
  .rec-tab.active { color: var(--ink); border-color: #38424f; }
  .rec-row {
    display: flex; align-items: center; gap: 8px; padding: 7px 2px;
    border-top: 1px solid var(--line); font-size: 13px;
  }
  .rec-row:first-child { border-top: none; }
  .rec-time { color: #5c6b7a; font-size: 12px; flex-shrink: 0; }
  .rec-code {
    flex: 1; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 11px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rec-row .btn { padding: 2px 10px; font-size: 12px; flex-shrink: 0; }
  .rec-mini {
    border: none; background: none; cursor: pointer; color: var(--ink2);
    padding: 2px; line-height: 0; flex-shrink: 0;
  }
  .rec-mini:hover { color: var(--ink); }
  .rec-mini.on { color: #f7e96b; }
  .rec-empty { color: #5c6b7a; font-size: 13px; text-align: center; padding: 12px 0; }
  .code-bar {
    position: relative; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px 10px 18px; margin-top: 20px; font-size: 14px; overflow: hidden;
  }
  .code-bar::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--grad-v);
  }
  .code-bar .code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-weight: 700;
    background: var(--grad); background-clip: text; -webkit-background-clip: text; color: transparent;
  }
  .code-bar input {
    flex: 1; min-width: 140px; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px;
  }
  .code-bar input::placeholder { color: var(--ink2); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); cursor: pointer; font-size: 13px; color: var(--ink);
    font-family: inherit; transition: border-color 150ms ease;
  }
  .btn:hover { border-color: #38424f; }
  .btn.primary {
    border: 1px solid transparent;
    background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box;
  }
  /* 摘要 hero 卡 */
  .hero {
    position: relative;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 20px; margin-bottom: 14px; text-align: center;
  }
  .hero-title { font-size: 24px; font-weight: 600; color: var(--ink); }
  .hero-pitch { font-size: 15px; margin: 8px 0 6px; }
  .hero-meta { color: var(--ink2); font-size: 13px; }
  /* TAB 栏 */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 8px 8px; text-align: center; cursor: pointer;
    font-family: inherit; color: var(--ink); line-height: 1.4;
    transition: border-color 150ms ease;
  }
  .tab:hover { border-color: #38424f; }
  .tab.locked { background: #161b24; border-color: #38424f; }
  .tab.active::after {
    content: ""; position: absolute; left: 18%; right: 18%; bottom: -1px;
    height: 2px; background: var(--grad); border-radius: 2px;
    animation: hueflow 6s linear infinite;
  }
  .tab-label { display: block; font-size: 14px; font-weight: 600; }
  .tab-val {
    display: block; font-size: 11px; color: var(--ink2); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tab-lock {
    position: absolute; top: 3px; right: 4px; border: none; background: none;
    cursor: pointer; opacity: 0.45; padding: 2px; color: var(--ink2); line-height: 0;
  }
  .tab.locked .tab-lock { opacity: 1; color: var(--ink); }
  /* 详情面板 */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px;
  }
  .panel h2 { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .note { color: var(--ink2); font-size: 12px; letter-spacing: 0.05em; margin-bottom: 10px; }
  .panel-in { animation: panelIn 200ms ease-out; }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  .tab-lock.pop { animation: pop 150ms ease-out; }
  @keyframes pop { 50% { transform: scale(1.35); } }
  .tags { margin: 6px 0; }
  .tag {
    display: inline-block; font-size: 12px; color: var(--ink2);
    border: 1px solid var(--line); border-radius: 20px; padding: 1px 10px;
    margin: 2px 4px 2px 0;
  }
  .kv { font-size: 14px; color: var(--ink2); margin: 4px 0; }
  .kv b { color: var(--ink); font-weight: 600; }
  .rules li { font-size: 14px; margin-left: 20px; }
  .act-line { font-size: 14px; margin: 6px 0; }
  .minis { display: flex; gap: 10px; margin: 10px 0; }
  .mini {
    flex: 1; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 8px; text-align: center;
  }
  .mini-name { font-size: 17px; font-weight: 600; }
  .mini-role {
    font-size: 12px; margin-top: 2px;
    background: var(--grad); background-clip: text; -webkit-background-clip: text; color: transparent;
  }
  .act { margin: 10px 0 4px; }
  .act-head { position: relative; font-weight: 600; font-size: 15px; padding-left: 11px; }
  .act-head::before {
    content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px;
    background: var(--grad-v); border-radius: 3px;
  }
  .beat { font-size: 14px; margin: 6px 0 6px 12px; }
  .beat .ep {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px;
    background: var(--grad); background-clip: text; -webkit-background-clip: text; color: transparent;
  }
  .beat .bdesc { color: var(--ink2); font-size: 13px; }
  .hook-box {
    position: relative; background: var(--card);
    padding: 10px 14px 10px 17px; border-radius: 0 8px 8px 0; font-size: 14px;
  }
  .hook-box::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--grad-v); border-radius: 3px 0 0 3px;
    animation: hueflow 6s linear infinite;
  }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .footer {
    text-align: center; color: #5c6b7a; font-size: 12px;
    letter-spacing: 0.05em; margin-top: 36px;
  }
  .footer-brand {
    text-align: center; color: #45515d; font-size: 11px;
    letter-spacing: 0.2em; margin-top: 8px;
  }
  #err { display: none; text-align: center; color: #ff5f6d; padding: 40px 0; }
  /* 老虎机滚动中候选文字降一档，定格瞬间 200ms 亮度脉冲 */
  .rolling { color: var(--ink2) !important; }
  .settled { animation: settlePulse 200ms ease-out; }
  @keyframes settlePulse { from { filter: brightness(1.8); } to { filter: brightness(1); } }
  @media (max-width: 640px) {
    .tab { padding: 8px 4px 6px; }
    .tab-label { font-size: 12px; }
    .tab-val { display: none; }
    .hero-title { font-size: 20px; }
  }
</style>
</head>

// ============ 生成模型（纯函数，无 DOM，可自检） ============
function drawNames(pool, rng) {
  const mk = () => {
    if (pool.names) return pick(pool.names, rng);
    if (pool.family) return pick(pool.given, rng) + "·" + pick(pool.family, rng);
    return pick(pool.surnames, rng) + pick(pool.given, rng);
  };
  const a = mk(); let b = mk(), c = mk();
  while (b === a) b = mk();
  while (c === a || c === b) c = mk();
  return {mc: a, rival: b, ally: c};
}

function fill(tpl, g, w, names, rng) {
  const conflict = pick(g.conflictWords.length ? g.conflictWords : ["矛盾"], rng);
  return tpl
    .replaceAll("{mc}", names.mc).replaceAll("{rival}", names.rival)
    .replaceAll("{ally}", names.ally)
    .replaceAll("{main}", g.tracks[0] ? g.tracks[0].name : "主线")
    .replaceAll("{sub}", g.tracks[1] ? g.tracks[1].name : "副线")
    .replaceAll("{conflict}", conflict)
    .replaceAll("{world}", w.name)
    .replaceAll("{res}", g.resolution || "主题兑现");
}

function beatLine(beat, g, w, names, rng) {
  const text = beat.name + " " + beat.desc;
  let cls = "generic";
  for (const [re, c] of BEAT_RULES) if (re.test(text)) { cls = c; break; }
  const tpl = pick(SENTENCES[cls], rng);
  return {tpl, line: fill(tpl, g, w, names, rng)};
}

function buildModel(c) {
  const D = window.GACHA_DATA;
  const g = D.genres[c.gi];
  const w = D.worldviews[c.wi];
  const s = D.skeletons[c.si];
  const cr = rngOf(c.cast);
  const culture = g.recommendedCulture || "modern-chinese-urban";
  const pool = D.namePools[D.culturePool[culture] || "cn"];
  const names = drawNames(pool, cr);
  const orng = rngOf(c.outline);
  const acts = s.acts.map(a => ({
    name: a.name, func: a.function, range: a.range,
    beats: a.beats.map(b => ({ep: b.ep, desc: b.desc, ...beatLine(b, g, w, names, orng)})),
  }));
  return {g, w, s, culture, names, acts, hook: fill(pick(HOOKS, orng), g, w, names, orng)};
}

// ============ 开局码 ============
// 格式：题材下标(2位)-世界观下标(1位)-骨架下标(1位)-人物种子(4位)-大纲种子(4位)，如 3k-9-b-k7x2-m9p4
// 开局码段长：题材2位(≤1295)/世界观1位(≤35)/骨架1位(≤35)/人物种子4位/句式种子4位
// 容量护栏在 scripts/export_gacha_web.py main() 里有对应断言，两边同步
const SEG_LENS = [2, 1, 1, 4, 4];
function encode(c) {
  return [c.gi.toString(36).padStart(2, "0"), c.wi.toString(36), c.si.toString(36), c.cast, c.outline].join("-");
}
function decode(code) {
  const segs = code.trim().toLowerCase().split("-");
  if (segs.length !== 5 || !segs.every((s, i) => s.length === SEG_LENS[i] && /^[0-9a-z]+$/.test(s))) return null;
  const D = window.GACHA_DATA;
  const gi = parseInt(segs[0], 36), wi = parseInt(segs[1], 36), si = parseInt(segs[2], 36);
  if (gi >= D.genres.length || wi >= D.worldviews.length || si >= D.skeletons.length) return null;
  return {gi, wi, si, cast: segs[3], outline: segs[4]};
}

// ============ 抽卡动效（老虎机式定格，纯展示随机值不进 state） ============
const SETTLE_MS = {genre: 400, worldview: 550, skeleton: 700, cast: 850};
const anim = {intervals: [], timeouts: []};
function cancelAnim() {
  anim.intervals.forEach(clearInterval);
  anim.timeouts.forEach(clearTimeout);
  anim.intervals = []; anim.timeouts = [];
}

// 老虎机滚动涉及的元素：滚动中降一档色（.rolling），定格瞬间 200ms 亮度脉冲（.settled）
const slotEls = b => b === "genre" ? [$("heroTitle"), $("tabVal-genre")]
  : b === "worldview" ? [$("heroMetaW"), $("tabVal-worldview")]
  : b === "skeleton" ? [$("heroMetaS"), $("tabVal-skeleton")]
  : b === "cast" ? [$("heroMetaCast"), $("tabVal-cast")]
  : [$("tabVal-outline")];

function overlayRandom(b, m) {
  slotEls(b).forEach(el => el.classList.add("rolling"));
  const D = window.GACHA_DATA;
  const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
  if (b === "genre") {
    const t = rnd(D.genres).title;
    $("heroTitle").textContent = t;
    $("heroPitch").textContent = "……";
    $("tabVal-genre").textContent = t;
  } else if (b === "worldview") {
    const n = rnd(D.worldviews).name;
    $("heroMetaW").textContent = n;
    $("tabVal-worldview").textContent = n;
  } else if (b === "skeleton") {
    const n = rnd(D.skeletons).name;
    $("heroMetaS").textContent = n;
    $("tabVal-skeleton").textContent = n;
  } else if (b === "cast") {
    const pool = D.namePools[D.culturePool[m.culture] || "cn"];
    const mk = () => pool.names ? rnd(pool.names)
      : pool.family ? rnd(pool.given) + "·" + rnd(pool.family)
      : rnd(pool.surnames) + rnd(pool.given);
    const a = mk(), b2 = mk(), c = mk();
    $("heroMetaCast").textContent = `主角 ${a} · 对手 ${b2} · 盟友 ${c}`;
    $("tabVal-cast").textContent = `${a}·${b2}·${c}`;
  }
}

function settleBlock(b, m) {
  if (b === "outline") {
    $("tabVal-outline").textContent = tabValue("outline", m);
  } else {
    setHeroBlock(b, m);
    $(`tabVal-${b}`).textContent = tabValue(b, m);
  }
  slotEls(b).forEach(el => {
    el.classList.remove("rolling");
    el.classList.remove("settled");
    void el.offsetWidth; // 强制重排，让连续定格也重播脉冲
    el.classList.add("settled");
  });
  if (activeTab === b) renderPanel(m);
}

function render(animate = false) {
  cancelAnim();
  const m = buildModel(state);
  $("codeText").textContent = encode(state);
  history.replaceState(null, "", "#" + encode(state));
  renderHero(m);
  renderFortune(m);
  renderFavBtn();
  renderTabs(m);
  for (const b of BLOCKS) slotEls(b).forEach(el => el.classList.remove("rolling", "settled"));
  $("pack").style.display = "block";
  $("codeBar").style.display = "flex";
  $("actions").style.display = "flex";
  if (!animate) { renderPanel(m); return; }
  // 老虎机：未锁定块的 hero/tab 小字每 50ms 换随机候选，按 题材→世界观→骨架→人物 定格；
  // 锁定 tab 不参与滚动直接保持；详情面板在各块定格时才刷新（定格前保留旧内容）
  for (const b of ["genre", "worldview", "skeleton", "cast"]) {
    if (state.locks[b]) continue;
    overlayRandom(b, m);
    const iv = setInterval(() => overlayRandom(b, m), 50);
    anim.intervals.push(iv);
    anim.timeouts.push(setTimeout(() => { clearInterval(iv); settleBlock(b, m); }, SETTLE_MS[b]));
  }
  if (!state.locks.outline) {
    $("tabVal-outline").textContent = "……";
    $("tabVal-outline").classList.add("rolling");
    anim.timeouts.push(setTimeout(() => settleBlock("outline", m), SETTLE_MS.cast + 150));
  }
}

function switchTab(b) {
  if (b === activeTab) return;
  activeTab = b;
  const m = buildModel(state);
  renderTabs(m);
  renderPanel(m);
}

];
let zodiac = LS.get(LS_ZODIAC, null);
if (!ZODIACS.some(z => z.name === zodiac)) zodiac = null;

// 题材下标加权取样：星座未选时退化为均匀随机，行为与原 Math.floor(Math.random()*len) 完全一致
function pickGenre() {
  const D = window.GACHA_DATA;
  const z = ZODIACS.find(z => z.name === zodiac);
  if (!z) return Math.floor(Math.random() * D.genres.length);
  let total = 0;
  const weights = D.genres.map(g => g.tags.some(t => z.tags.includes(t)) ? 3 : 1);
  for (const w of weights) total += w;
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
  return D.genres.length - 1;
}

// 字符串哈希（FNV-1a 32bit）：喂 mulberry32 做确定性玄学输出
function strHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const todayStr = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

// 玄学批注：同码同星座同一天恒定（确定性，无状态）
const FORTUNE_TPLS = [
  "{zodiac}今日与「{genre}」相位相合——这开局藏着你的本命故事",
  "水星顺行：{mc}的决断力加成，宜立刻动笔",
  "{zodiac}的守护星落在「{world}」，世界观与你同频",
  "卦象显示：「{main}」线宜慢热，前三集忍住别爆",
  "{zodiac}注意：{rival}这类对手，专治你的拖延症",
  "今日抽到「{genre}」：{zodiac}的直觉会替你写好第一章",
  "黄道吉日加持：此坑烂尾率下降（玄学意义上）",
  "{zodiac}×「{genre}」：星盘说这里有个你没见过的反转",
];
function fortuneOf(code, zodiacName, dateStr) {
  const rng = mulberry32(strHash(`${code}|${zodiacName}|${dateStr}`));
  return {stars: 1 + Math.floor(rng() * 5), tpl: FORTUNE_TPLS[Math.floor(rng() * FORTUNE_TPLS.length)]};
}
function renderFortune(m) {
  const box = $("fortune");
  if (!zodiac) { box.style.display = "none"; return; }
  const f = fortuneOf(encode(state), zodiac, todayStr());
  const text = f.tpl
    .replaceAll("{zodiac}", zodiac).replaceAll("{genre}", m.g.title)
    .replaceAll("{mc}", m.names.mc).replaceAll("{rival}", m.names.rival)
    .replaceAll("{world}", m.w.name)
    .replaceAll("{main}", m.g.tracks[0] ? m.g.tracks[0].name : "主线");
  box.innerHTML = `<span class="stars">${"★".repeat(f.stars)}${"☆".repeat(5 - f.stars)}</span>${esc(text)}`;
  box.style.display = "block";
}
function renderZodiacChips() {
  $("zodiacChips").innerHTML = ZODIACS.map(z =>
    `<button class="chip${z.name === zodiac ? " active" : ""}" data-z="${z.name}">${z.name}</button>`).join("");
}
function setZodiac(name) {
  zodiac = name || null;
  if (zodiac) LS.set(LS_ZODIAC, zodiac); else LS.remove(LS_ZODIAC);
  renderZodiacChips();
  if (window.GACHA_DATA) renderFortune(buildModel(state));
}

// 今日黄历：当天日期哈希抽 3 宜 2 忌（同一洗牌序列取样，宜忌天然不重叠），纯展示不影响抽卡
const ALMANAC_POOL = ["冒险", "悬疑", "烧脑", "言情", "爽文", "权谋", "恐怖", "科幻", "奇幻", "种田",
  "竞技", "复仇", "甜宠", "虐心", "治愈", "规则怪谈", "穿越", "都市", "历史", "刑侦"];
function almanacOf(dateStr) {
  const rng = mulberry32(strHash(`almanac|${dateStr}`));
  const idx = ALMANAC_POOL.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return {yi: idx.slice(0, 3).map(i => ALMANAC_POOL[i]), ji: idx.slice(3, 5).map(i => ALMANAC_POOL[i])};
}
function renderAlmanac() {
  const {yi, ji} = almanacOf(todayStr());
  $("almanac").textContent = `今日黄历 · 宜 ${yi.join(" / ")} · 忌 ${ji.join(" / ")}`;
}

// 抽卡历史：只有用户点抽卡按钮才记（首载/码还原/hashchange 不记），FIFO 上限 50
function pushHistory() {
  const list = [{code: encode(state), genreTitle: window.GACHA_DATA.genres[state.gi].title, ts: Date.now()},
    ...LS.get(LS_HISTORY, [])].slice(0, 50);
  LS.set(LS_HISTORY, list);
}

// 收藏：星钮切换，上限 100，状态随渲染刷新
function isFav(code) { return LS.get(LS_FAVS, []).some(f => f.code === code); }
function renderFavBtn() {
  const on = isFav(encode(state));
  const b = $("favBtn");
  b.innerHTML = icon(on ? "star-fill" : "star", 16);
  b.classList.toggle("on", on);
  b.title = on ? "取消收藏" : "收藏当前开局";
}
function toggleFav() {
  const code = encode(state);
  let list = LS.get(LS_FAVS, []);
  if (list.some(f => f.code === code)) list = list.filter(f => f.code !== code);
  else list = [{code, genreTitle: window.GACHA_DATA.genres[state.gi].title, ts: Date.now()}, ...list].slice(0, 100);
  LS.set(LS_FAVS, list);
  renderFavBtn();
  const b = $("favBtn");
  b.classList.remove("pop");
  void b.offsetWidth;
  b.classList.add("pop");
}

// 记录面板：历史 / 收藏两个子 TAB
let recTab = "hist";
function fmtTime(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderRecTabs() {
  $("recTabHist").classList.toggle("active", recTab === "hist");
  $("recTabFav").classList.toggle("active", recTab === "fav");
}
function renderRecList() {
  const hist = recTab === "hist";
  const list = LS.get(hist ? LS_HISTORY : LS_FAVS, []);
  $("recList").innerHTML = list.length ? list.map(it =>
    `<div class="rec-row"><span>${esc(it.genreTitle)}</span><span class="rec-time">${fmtTime(it.ts)}</span>` +
    `<span class="rec-code">${esc(it.code)}</span>` +
    (hist ? `<button class="rec-mini${isFav(it.code) ? " on" : ""}" data-act="fav" data-code="${esc(it.code)}" title="转收藏">${icon(isFav(it.code) ? "star-fill" : "star")}</button>` : "") +
    `<button class="btn" data-act="restore" data-code="${esc(it.code)}">还原</button>` +
    (hist ? "" : `<button class="rec-mini" data-act="del" data-code="${esc(it.code)}" title="删除">${icon("trash")}</button>`) +
    `</div>`).join("")
    : `<p class="rec-empty">暂无记录，去抽一发</p>`;
}
function refreshRecIfOpen() {
  if ($("recPanel").style.display !== "none") renderRecList();
}
// 等同粘贴码还原：decode → state → render，不播动效，不记历史
function restoreCode(code) {
  const c = decode(code);
  if (!c) return;
  Object.assign(state, c); state.locks = {}; render();
}

// ============ 交互 ============
function roll(animate = true) {
  const locked = BLOCKS.filter(b => state.locks[b]);
  if (locked.length === BLOCKS.length) { alert("已全部锁定，先解锁再 Roll"); return; }
  const D = window.GACHA_DATA;
  const rand = n => Math.floor(Math.random() * n);
  if (!state.locks.genre) state.gi = pickGenre(); // 星座加权只在此处生效；未选星座时退化为均匀随机
  const g = D.genres[state.gi]; // 世界观/骨架跟随当前题材推荐（含题材被锁定的情况）
  if (!state.locks.worldview) {
    const i = g.recommendedPreset && Math.random() < 0.7
      ? D.worldviews.findIndex(x => x.key === g.recommendedPreset) : -1;
    state.wi = i >= 0 ? i : rand(D.worldviews.length);
  }
  if (!state.locks.skeleton) {
    const i = g.recommendedTemplates.length && Math.random() < 0.7
      ? D.skeletons.findIndex(x => x.id === g.recommendedTemplates[0]) : -1;
    state.si = i >= 0 ? i : rand(D.skeletons.length);
  }
  if (!state.locks.cast) state.cast = newSeg();
  if (!state.locks.outline) state.outline = newSeg();
  render(animate);
}
function copyText(text, btn) {
  if (!navigator.clipboard) { alert("当前环境不支持自动复制，请手动复制"); return; }
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.innerHTML;
    btn.innerHTML = icon("check") + "<span>已复制</span>";
    setTimeout(() => { btn.innerHTML = old; }, 1200);
  }).catch(() => alert("复制失败，请手动选中复制"));
}
function initPage() {
  // 静态按钮注入内联 SVG 图标（文案保留在 span 里，复制反馈时整体替换再还原）
  $("rollBtn").innerHTML = icon("dice", 18) + "<span>抽一个开局</span>";
  $("copyCodeBtn").innerHTML = icon("copy") + "<span>复制码</span>";
  $("restoreBtn").innerHTML = icon("rotate-ccw") + "<span>还原</span>";
  $("copyMdBtn").innerHTML = icon("copy") + "<span>复制大纲</span>";
  $("dlMdBtn").innerHTML = icon("download") + "<span>下载 .md</span>";
  $("recBtn").innerHTML = icon("history") + "<span>记录</span>";
  $("mysticToggle").innerHTML = icon("sparkles") + "<span>玄学加成（可选）</span><span class=\"chev\">" + icon("chevron-down", 12) + "</span>";
  renderAlmanac(); // 黄历不依赖 data.js，始终显示
  $("mysticToggle").onclick = () => {
    const body = $("mysticBody");
    const open = body.style.display === "none";
    body.style.display = open ? "block" : "none";
    $("mysticToggle").classList.toggle("open", open);
    $("mysticToggle").setAttribute("aria-expanded", String(open));
  };
  renderZodiacChips();
  $("zodiacChips").onclick = e => {
    const chip = e.target.closest(".chip");
    if (chip) setZodiac(zodiac === chip.dataset.z ? null : chip.dataset.z);
  };
  if (!window.GACHA_DATA) {
    $("err").style.display = "block";
    $("rollBtn").disabled = true;
    return;
  }
  const D = window.GACHA_DATA;
  $("sub").textContent = `${D.genres.length} 题材 × ${D.worldviews.length} 世界观 × ${D.skeletons.length} 骨架 · 一次抽齐开局，锁定满意的部分再 Roll`;
  $("footer").textContent = `开局结构来自 StoryOS 题材库 · ${D.genres.length} 题材 × ${D.worldviews.length} 世界观 × ${D.skeletons.length} 骨架`;
  $("rollBtn").onclick = () => {
    const before = encode(state);
    roll();
    // 全锁定时 roll() 原样返回（码不变）不记日志；有效抽卡才追加历史并刷新批注/记录面板
    if (encode(state) !== before) { pushHistory(); refreshRecIfOpen(); }
  };
  // 按钮内含 SVG，e.target 可能落在图标节点上——用 currentTarget 锁定按钮本体
  $("copyCodeBtn").onclick = e => copyText(encode(state), e.currentTarget);
  $("copyMdBtn").onclick = e => copyText(toMarkdown(), e.currentTarget);
  $("dlMdBtn").onclick = () => {
    const blob = new Blob([toMarkdown()], {type: "text/markdown;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `开局包-${encode(state)}.md`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  $("restoreBtn").onclick = () => {
    const c = decode($("codeInput").value);
    if (!c) { alert("开局码格式不对（应为 5 段：题材-世界观-骨架-人物-大纲，如 3k-9-b-k7x2-m9p4）"); return; }
    Object.assign(state, c); state.locks = {}; render(); // 还原不播动效
  };
  $("favBtn").onclick = () => { toggleFav(); refreshRecIfOpen(); };
  $("recBtn").onclick = () => {
    const p = $("recPanel");
    const open = p.style.display === "none";
    p.style.display = open ? "block" : "none";
    if (open) renderRecList();
  };
  $("recTabHist").onclick = () => { recTab = "hist"; renderRecTabs(); renderRecList(); };
  $("recTabFav").onclick = () => { recTab = "fav"; renderRecTabs(); renderRecList(); };
  $("recList").onclick = e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const {act, code} = btn.dataset;
    if (act === "restore") restoreCode(code);
    else if (act === "fav") {
      const list = LS.get(LS_FAVS, []);
      if (list.some(f => f.code === code)) LS.set(LS_FAVS, list.filter(f => f.code !== code));
      else {
        const it = LS.get(LS_HISTORY, []).find(h => h.code === code);
        LS.set(LS_FAVS, [{code, genreTitle: it ? it.genreTitle : window.GACHA_DATA.genres[decode(code).gi].title, ts: Date.now()}, ...list].slice(0, 100));
      }
      renderFavBtn(); renderRecList();
    } else if (act === "del") {
      LS.set(LS_FAVS, LS.get(LS_FAVS, []).filter(f => f.code !== code));
      renderFavBtn(); renderRecList();
    }
  };
  $("tabs").onclick = e => {
    const tabEl = e.target.closest(".tab");
    if (!tabEl) return;
    const b = tabEl.dataset.tab;
    if (e.target.closest(".tab-lock")) {
      state.locks[b] = !state.locks[b];
      tabEl.classList.toggle("locked", !!state.locks[b]);
      const lockEl = e.target.closest(".tab-lock");
      lockEl.innerHTML = icon(state.locks[b] ? "lock" : "lock-open");
      lockEl.classList.remove("pop");
      void lockEl.offsetWidth;
      lockEl.classList.add("pop");
      return;
    }
    switchTab(b);
  };
  window.addEventListener("hashchange", () => {
    const c = decode(location.hash.slice(1));
    if (c) { Object.assign(state, c); state.locks = {}; render(); }
  });
  const fromHash = decode(location.hash.slice(1));
  if (fromHash) { Object.assign(state, fromHash); render(); }
  else roll(false); // 首次加载不播动效；初始无任何锁定，等同全部重摇
}

// ============ 自检（?selftest=1 时在 console 输出结果） ============
function selftest() {
  const D = window.GACHA_DATA;
  for (let i = 0; i < 200; i++) {
    const c = {
      gi: Math.floor(Math.random() * D.genres.length),
      wi: Math.floor(Math.random() * D.worldviews.length),
      si: Math.floor(Math.random() * D.skeletons.length),
      cast: newSeg(), outline: newSeg(),
    };
    const m1 = buildModel(c);
    const m2 = buildModel(decode(encode(c)));
    if (JSON.stringify(m1) !== JSON.stringify(m2))
      throw new Error("开局码还原不一致 @" + encode(c));
    const ns = [m1.names.mc, m1.names.rival, m1.names.ally];
    if (new Set(ns).size !== 3) throw new Error("人物重名 @" + encode(c));
    if (!m1.acts.length || !m1.acts[0].beats.length) throw new Error("大纲为空");
  }
  console.log("SELFTEST PASS：200 组开局码还原一致、人物不重名、大纲非空");
  document.title = "SELFTEST PASS";
}

initPage();
if (location.search.includes("selftest") && window.GACHA_DATA) selftest();
</script>
